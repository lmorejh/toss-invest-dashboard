<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🔒 내 투자 대시보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232a78d6%22%2F%3E%3Cpath%20d%3D%22M12%2046%20L26%2032%20L36%2040%20L52%2020%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2220%22%20r%3D%225%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="journal-format.js"></script>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --line: #2a78d6; --bar: #2a78d6; --bar-cash: #c3c2b7;
  --up: #d03b3b; --down: #1c5cab; --warn: #b26b00; --border: #e6e5df; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --surface: #1a1a19; --card: #161615; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --line: #3987e5; --bar: #3987e5; --bar-cash: #52514e;
    --up: #e66767; --down: #6da7ec; --warn: #fab219; --border: #2c2c2a; --accent: #3987e5; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

/* 잠금 화면 */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; display: grid; gap: 12px; }
#lock h1 { font-size: 18px; margin: 0; }
#lock .err { color: var(--up); font-size: 13px; min-height: 18px; }

/* 레이아웃 */
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border); }
.bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.bar h1 { font-size: 17px; margin: 0; }
nav { max-width: 1280px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 12px; color: var(--ink2); white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--ink2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.grid2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .grid2, .grid2e { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: clamp(17px, 2vw, 22px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .n { color: var(--ink2); font-size: 12px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.wrap { white-space: normal; text-align: left; min-width: 220px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; color: var(--ink2); }
ul.flags { margin: 10px 0 0; padding-left: 18px; } ul.flags li { margin: 3px 0; }
.WARN { color: var(--warn); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none; white-space: nowrap; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
.report { overflow-x: auto; }
.report h1 { font-size: 18px; } .report h2 { font-size: 16px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 20px; } .report h3 { font-size: 14px; }
.report blockquote { margin: 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
.report table { margin: 8px 0; font-size: 13px; }
.item { padding: 9px 0; border-bottom: 1px solid var(--border); }
.item .meta { color: var(--muted); font-size: 11px; }
.list { max-height: 640px; overflow-y: auto; }
.stance { font-size: 15px; font-weight: 600; }
.hidden { display: none !important; }
.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .ngrid { grid-template-columns: 1fr; } }
.nitem { padding: 8px 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
.nitem:last-child { border-bottom: 0; }
.nitem a { color: var(--ink); text-decoration: none; }
.nitem a:hover { text-decoration: underline; }
.nitem .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.badge.DISC { border-color: var(--warn); color: var(--warn); }
.badge.TBUY { background: var(--up); border-color: var(--up); color: #fff; }
.badge.TSELL { background: var(--down); border-color: var(--down); color: #fff; }
.badge.TWAIT { color: var(--ink2); border-style: dashed; }
.badge.TPLACED { border-style: dashed; border-color: var(--accent, #3b82f6); color: var(--accent, #3b82f6); }
.badge.TDONE { color: var(--muted); }
.tline.done { opacity: .75; }
.tgroup { padding: 8px 0; border-bottom: 1px solid var(--border); }
.tgroup:last-child { border-bottom: 0; }
.tline { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 10px; align-items: baseline; padding: 5px 0 5px 8px; border-left: 2px solid var(--border); margin: 4px 0 0 2px; }
.tline .what { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tline .amt { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tline .cond { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); line-height: 1.5; }
.tline .note { grid-column: 1 / -1; font-size: 12px; color: var(--warn); }
.badge.DISC_IMP { background: var(--warn); border-color: var(--warn); color: #fff; }
.sig { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sig div { background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.sig .k { color: var(--muted); font-size: 11px; display: block; }
.badge.STOP_HIT { border-color: var(--up); color: #fff; background: var(--up); }
.badge.STOP_WARN { border-color: var(--warn); color: var(--warn); }
.badge.EXEMPT { color: var(--ink2); border-style: dashed; }
.badge.BREAKEVEN { border-color: #0ca30c; color: #0ca30c; }
.badge.ADD_BUY { border-color: var(--accent); color: var(--accent); }
.plan { margin-top: 6px; padding: 8px 10px; background: var(--surface); border-radius: 8px; font-variant-numeric: tabular-nums; }
/* 투자 일지 */
.jwrap { max-width: 820px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.jtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.jtools input { flex: 1; min-width: 160px; }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.jday { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 10px 2px 0; }
.jentry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
.jhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.jhead .time { font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
.badge.REVIEW, .badge.COWORK { border-color: var(--accent); color: var(--accent); }
.badge.BUY { border-color: var(--up); color: var(--up); }
.badge.SELL { border-color: var(--down); color: var(--down); }
.badge.AUTO, .badge.TRADE { color: var(--ink2); }
.jbody { font-size: 15px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
.jbody p { margin: 0 0 10px; } .jbody p:last-child { margin-bottom: 0; }
.jbody ul, .jbody ol { margin: 4px 0 10px; padding-left: 22px; } .jbody li { margin: 4px 0; }
.jbody strong { font-weight: 700; }
.jbody.clamp { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.jmore { margin-top: 6px; border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
</style>
</head>
<body>

<div id="lock">
  <form id="lockForm">
    <h1>투자 대시보드</h1>
    <div class="muted" style="font-size:13px">데이터는 암호화되어 있습니다. 비밀번호를 입력하세요.</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label style="font-size:13px;display:flex;gap:6px;align-items:center"><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
    <button class="primary" type="submit" id="unlockBtn">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <h1>내 투자 대시보드</h1>
      <div class="muted" style="font-size:12px"><span id="asof"></span> · <button id="reload" style="padding:3px 10px;font-size:12px">새로고침</button> <button id="logout" style="padding:3px 10px;font-size:12px">잠그기</button></div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="on">개요</button>
      <button data-tab="orders">내 주문</button>
      <button data-tab="reports">리포트</button>
      <button data-tab="docs">브리핑·회고</button>
      <button data-tab="recs">추천 종목</button>
      <button data-tab="news">뉴스·공시</button>
      <button data-tab="market">시황</button>
      <button data-tab="journal">투자 일지</button>
      <button data-tab="alerts">알림</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
// ---------- 유틸 ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (x) => x == null ? '-' : Math.round(x).toLocaleString('ko-KR') + '원';
const manwon = (x) => x == null ? '-' : (x / 1e4).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '만';
const eok = (x) => x == null ? '-' : (x > 0 ? '+' : '') + (x / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '억';
const pct = (x, d = 2) => x == null || isNaN(x) ? '-' : (x > 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const pctAbs = (x, d = 1) => x == null ? '-' : (x * 100).toFixed(d) + '%';
const cls = (x) => x > 0 ? 'up' : x < 0 ? 'down' : '';
const price = (x, cur) => x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR');
const kst = (iso) => iso ? new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const STATUS_KO = { OPEN: '진행', TARGET_HIT: '목표 도달', STOPPED: '손절', EXPIRED: '만기' };

// ---------- 복호화 ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(enc, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
// 배포 때 페이지 버전이 박힘 — 열려 있던 탭이 예전 코드로 남지 않도록, 새 버전이 올라오면 페이지째 다시 불러온다
const PAGE_VERSION = '1f6f4012c67dc297e3e38413f8bcdf53bd33384b42a921c1ec17d7a7dd2bb9e9';
async function checkPageVersion() {
  if (PAGE_VERSION.startsWith('__')) return;
  try {
    const v = await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (v.page && v.page !== PAGE_VERSION) { location.replace(location.pathname + '?v=' + v.page.slice(0, 8) + location.hash); return true; }
  } catch {}
}
async function fetchEnc() {
  if (await checkPageVersion()) return new Promise(() => {}); // 새 페이지로 넘어가는 중
  const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('데이터 파일을 불러오지 못했습니다 (' + r.status + ')');
  return r.json();
}

let D = null, password = null, tab = 'overview';

async function unlock(pw, { silent = false } = {}) {
  $('#unlockBtn').disabled = true; $('#err').textContent = silent ? '' : '복호화 중…';
  try {
    D = await decrypt(await fetchEnc(), pw);
    password = pw;
    if ($('#remember').checked || store.get('dash-pw')) store.set('dash-pw', pw);
    $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden');
    render();
  } catch (e) {
    $('#err').textContent = e.name === 'OperationError' ? '비밀번호가 맞지 않습니다.' : e.message;
    if (silent) store.del('dash-pw');
  } finally { $('#unlockBtn').disabled = false; }
}
$('#lockForm').addEventListener('submit', (e) => { e.preventDefault(); unlock($('#pw').value); });
$('#logout').addEventListener('click', () => { store.del('dash-pw'); D = null; password = null; $('#pw').value = ''; $('#err').textContent = ''; $('#app').classList.add('hidden'); $('#lock').classList.remove('hidden'); updateTitle(); });
$('#reload').addEventListener('click', () => password && unlock(password, { silent: true }));
// 탭을 다시 볼 때 5분 넘게 지났으면 자동으로 새 데이터 (새 페이지 버전이면 페이지째)
let lastLoad = Date.now();
document.addEventListener('visibilitychange', () => { if (!document.hidden && password && Date.now() - lastLoad > 5 * 60_000) { lastLoad = Date.now(); unlock(password, { silent: true }); } });
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); render(); window.scrollTo(0, 0); });
const saved = store.get('dash-pw'); if (saved) { $('#remember').checked = true; unlock(saved, { silent: true }); }

// ---------- 브라우저 탭 제목: 다른 탭과 구분되도록 오늘 손익·현재 탭·경고 표시 ----------
const TAB_NAMES = { orders: '내 주문', news: '뉴스·공시', overview: '개요', reports: '리포트', docs: '브리핑·회고', recs: '추천 종목', market: '시황', journal: '투자 일지', alerts: '알림' };
function updateTitle() {
  if (!D) { document.title = '🔒 내 투자 대시보드'; return; }
  const r = D.portfolio?.summary?.dailyPl?.rate;
  const day = r == null ? '' : (r > 0 ? '🔴 +' : r < 0 ? '🔵 ' : '⚪ ') + (r * 100).toFixed(2) + '% · ';
  // 지금 유효한 손절·손절 임박·본전 도달 신호가 있을 때만 경고 표시
  const warn = (D.view?.holdings || []).some((x) => ['STOP_HIT', 'STOP_WARN', 'BREAKEVEN'].includes(x.signal?.state));
  document.title = (warn ? '⚠️ ' : '') + day + TAB_NAMES[tab] + ' | 내 투자';
}

// ---------- 렌더 ----------
function render() {
  updateTitle();
  $('#asof').textContent = (tab === 'market' && D.marketsUpdatedAt ? '시황 ' + kst(D.marketsUpdatedAt) : '데이터 ' + kst(D.generatedAt)) + ' 기준';
  $('#view').innerHTML = ({ overview, orders, reports, docs, recs, news, market, journal, alerts })[tab]();
  if (tab === 'overview') { historyChart(); allocChart(); }
  if (tab === 'reports') bindReports();
  if (tab === 'docs') bindDocs();
  if (tab === 'journal') bindJournal();
  if (tab === 'news') bindNews();
  if (tab === 'orders') bindOrders();
  if (tab === 'market') bindMarket();
}

// ---------- 실시간 대응 전략 (국내 정규장 중 5분마다 판정) ----------
function strategyCard() {
  const S = D.strategy;
  if (!S) return '';
  const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  const stale = S.date !== today;
  const color = { A: 'var(--up)', B: 'var(--ink2)', C: 'var(--down)' }[S.scenario];
  const p = S.plan || {};
  const mk = (m, k) => m ? `<span><span class="muted">${k}</span> <b>${Math.round(m.value).toLocaleString('ko-KR')}</b> <span class="muted">${esc(m.name)}</span></span>` : '';
  const actionCls = (a) => /보류|중단|손절|무효|금지|부족/.test(a) ? 'SELL' : /가능|허용/.test(a) ? 'BUY' : '';
  return `<section class="card" style="border-left:4px solid ${color}">
    <h2><span>실시간 대응 전략 ${stale ? '<span class="pill">지난 판정</span>' : S.mode === 'after' ? '<span class="pill">NXT 애프터마켓 · 5분마다 ~20:00</span>' : S.final ? '<span class="pill">거래 종료 · 오늘 최종 판정</span>' : '<span class="pill">국내 정규장 · 5분마다</span>'}</span>
      <span style="font-size:15px;color:${color};font-weight:700">시나리오 ${S.scenario} · ${esc(S.label)}</span></h2>
    <div class="muted" style="font-size:12px;margin:-6px 0 8px">${esc(S.date)} ${hm(S.updatedAt)} 판정 · ${hm(S.since)}부터 유지${S.previous ? ` · 이전 ${esc(S.previous)}` : ''}${(S.final && S.mode !== 'after') || stale ? ' · 다음 판정: 다음 거래일 장 시작 후 (정규장 · 애프터마켓 중 5분마다)' : ''}</div>
    <ul class="flags" style="margin:0 0 10px">${S.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:10px">${mk(p.R2, 'R2')}${mk(p.R1, 'R1')}${mk(p.S1, 'S1')}${mk(p.S2, 'S2')}</div>
    <div class="grid2e">
      <div><div class="muted" style="font-size:12px;margin-bottom:4px">대응 요약 <span style="font-size:11px">— 종목별 수량·가격·시점은 '오늘의 판단 → 매매 계획'</span></div>${
        // 전체·현금은 이유까지, 종목은 한 줄(이유는 마우스를 올리면)
        S.actions.filter((a) => !a.symbol).map((a) => `<div class="item" style="padding:6px 0"><b>${esc(a.target)}</b> <span class="badge ${actionCls(a.action)}">${esc(a.action)}</span><div class="muted" style="font-size:12px">${esc(a.reason)}</div></div>`).join('')
      }<div style="display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:8px">${
        // 미보유(추천·관찰) 종목은 진입 시점(지금·지정가)일 때만 — 진입 보류는 개수와 이름만 한 줄
        S.actions.filter((a) => a.symbol && (a.planQty === undefined || (a.trades || []).some((x) => x.when === 'now' || x.when === 'limit'))).map((a) => `<span style="white-space:nowrap;font-size:13px" title="${esc(a.reason)}">${esc(a.target)} <span class="badge ${actionCls(a.action)}">${esc(a.action)}</span></span>`).join('')
      }</div>${(() => { const w = S.actions.filter((a) => a.planQty !== undefined && a.trades?.length && !a.trades.some((x) => x.when === 'now' || x.when === 'limit')); return w.length ? `<div class="muted" style="font-size:12px;margin-top:6px">진입 대기 ${w.length}종목 — ${w.map((a) => esc(a.target.replace(/ · 관찰$/, ''))).join(', ')}</div>` : ''; })()}</div>
      <div><div class="muted" style="font-size:12px;margin-bottom:4px">외국인 누적 순매수 체크리스트 (경계 = 평소의 -50%, 이탈 = -100%)</div>
        <div class="scroll"><table><thead><tr><th>시각</th><th>경계</th><th>이탈</th><th>실제</th><th>판정</th></tr></thead><tbody>${
          S.checklist.map((c) => `<tr><td>${c.time}</td><td>${c.warn != null ? eok(c.warn) : '-'}</td><td>${c.danger != null ? eok(c.danger) : '-'}</td><td class="${cls(c.actual)}">${c.actual != null ? eok(c.actual) : '-'}</td><td>${esc(c.status)}</td></tr>`).join('')
        }</tbody></table></div></div>
    </div>
    <p class="muted" style="font-size:11px;margin:8px 0 0">규칙 기반 자동 판정(가격 마디 + 경과 시간 대비 외국인 수급). 참고용이며 투자 권유가 아닙니다.</p>
  </section>`;
}

function overview() {
  const p = D.portfolio, s = p?.summary || {}, v = D.view;
  if (!p) return '<div class="card empty">계좌 데이터가 아직 없습니다.</div>';
  return `
  ${strategyCard()}
  <section class="kpis">
    ${kpi('총자산', won(s.totalValueKRW), `주식 ${manwon(s.holdingsValueKRW)} · 현금 ${manwon(s.cashTotalKRW)}`)}
    ${kpi('누적 손익률', `<span class="${cls(s.pl?.rate)}">${pct(s.pl?.rate)}</span>`, `비용 차감 ${pct(s.pl?.rateAfterCost)}`)}
    ${kpi('오늘 손익률', `<span class="${cls(s.dailyPl?.rate)}">${pct(s.dailyPl?.rate)}</span>`, `계좌 ${kst(p.takenAt)} 기준`)}
    ${kpi('현금 비중', pctAbs(s.cashRatio), v ? `권장 ${v.strategy.cashTargetPct}%` : '')}

    ${(() => {

      const r = D.reports?.[0], s = D.portfolio?.summary, L = D.markets?.liveStance;

    <div class="muted" style="font-size:12px;margin-top:2px">${r ? `${esc(sessionKo(r.session))} 리포트 ${kst(r.created_at)} 기준` : '리포트 기준'}</div>
    ${s ? `<p style="margin:8px 0">지금 현금 비중 <b>${pctAbs(s.cashRatio)}</b> (약 ${won(s.cashTotalKRW)}) vs 권장 ${target}%${Math.abs(gap) >= 5 ? ` — <b>${gap > 0 ? '권장보다 ' + gap.toFixed(0) + '%p 많음' : '권장보다 ' + (-gap).toFixed(0) + '%p 적음'}</b>` : ' — 권장 범위'} <span class="muted" style="font-size:12px">· 계좌 ${kst(D.portfolio.takenAt)} 기준</span></p>` : `<p style="margin:8px 0">${esc(v.strategy.summary)}</p>`}`;
    })()}
    ${advicePanel()}
    ${adviceToday() ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:13px">규칙 기반 계산 (비교용 — 기계적 기준선)</summary>${tradePlan()}</details>` : tradePlan() || (v.strategy.actions?.length ? `<ul class="flags">${v.strategy.actions.map((a) => `<li>${esc(a.replace(/^([0-9][0-9A-Z]{5}|[A-Z][A-Z.]{0,5}):/, (m, s) => `${nameCode(s)}:`))}</li>`).join('')}</ul>` : '')}
  </section>` : ''}
  <div class="grid2">
    <section class="card"><h2><span>총자산 추이</span><span id="histChips"></span></h2><div class="muted" id="histSub" style="font-size:12px;margin:-6px 0 6px"></div><div class="chart" id="hist"></div></section>
    <section class="card"><h2>자산 구성</h2><div class="chart" id="alloc"></div></section>
  </div>
  <section class="card"><h2>보유 종목</h2><div class="scroll">${holdingsTable(p.items)}</div>
    ${p.flags?.length ? `<ul class="flags">${p.flags.map((f) => `<li class="${f.level}">${f.level === 'WARN' ? '⚠ ' : ''}${esc(f.msg)}</li>`).join('')}</ul>` : ''}
  </section>
  ${v?.holdings?.length ? holdingPlansCard(v) : ''}
  ${D.agentStatus ? `<section class="card"><h2>PC 에이전트 상태</h2><div class="report">${marked.parse(D.agentStatus.replace(/^# .*\n/, ''))}</div></section>` : ''}`;
}
// 오늘의 매매 계획: 언제·매수/매도·몇 주·얼마에 (규칙 기반 — 보유 종목 대응 옵션 + 실시간 대응 전략)
// ---------- 전문가 관점 판단 (Cowork 브리핑이 data/advice/*.json 으로 작성) ----------
function adviceToday() {
  const A = D.advice;
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  return A && (A.file || '').startsWith(today) ? A : null;
}
function advicePanel() {
  const A = D.advice;
  if (!A) return '<p class="muted" style="font-size:12px;margin:8px 0 0">전문가 관점 판단은 Cowork가 평일 09:45 아침 브리핑과 10:20~19:50 30분마다 작성해 여기에 표시됩니다. 아래는 규칙 기반 계산입니다.</p>';
  const fresh = !!adviceToday();
  const when = new Date(A.createdAt || A.savedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  const safeUrl = (u) => /^https?:\/\//.test(u || '');
  const hmK = (d) => d.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  // 데이터 시각: ISO(UTC 'Z' 포함)면 한국 시간으로 바꿔 표시
  const asOf = (() => { const s = String(A.dataAsOf || ''); const m = s.match(/^\d{4}-\d{2}-\d{2}T[\d:.]+(Z|[+-]\d{2}:?\d{2})?/); const d = m && new Date(m[0]); return d && !isNaN(d) ? hmK(d) : s.slice(0, 16).replace('T', ' '); })();
  // 작성 후 경과 시간
  const mins = Math.max(0, Math.round((Date.now() - new Date(A.createdAt || A.savedAt)) / 60000));
  const ago = mins < 60 ? `${mins}분 전` : `${Math.floor(mins / 60)}시간 ${mins % 60}분 전`;
  // 지금 값 (5분마다 갱신되는 계좌 데이터)
  const items = D.portfolio?.items || [];
  const pxAt = D.portfolio?.takenAt ? new Date(D.portfolio.takenAt).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
  const pos = (A.positions || []).map((p) => {
    const trades = Array.isArray(p.trades) ? p.trades : [];
    const h = items.find((i) => i.symbol === p.symbol);
    const usd = /^[A-Z]/.test(p.symbol || '');
    const m$ = (x) => usd ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(Number(x)).toLocaleString('ko-KR') + '원';
    const gone = p.kind !== '신규' && !h && !!D.portfolio; // 판단 뒤 전량 매도
    const gap = (x) => { const g = (x / h.lastPrice - 1) * 100; return `${g > 0 ? '+' : ''}${g.toFixed(1)}%`; };
    const dist = h?.lastPrice ? trades.filter((x) => x.price).map((x) => `${TWHEN[x.when] || x.when} ${m$(x.price)}까지 ${gap(x.price)}`) : [];
    const liveLine = gone ? '<div style="font-size:12px;margin-top:4px;color:var(--warn)"><b>지금</b> · 판단 이후 전량 매도되어 보유하지 않음</div>'
      : h?.lastPrice ? `<div style="font-size:12px;margin-top:4px"><b>지금</b> · 현재가 ${m$(h.lastPrice)} (${pxAt}) · 보유 ${h.quantity}주${dist.length ? ' · ' + dist.map(esc).join(' · ') : ''}</div>` : '';
    const nm = p.name ? `${p.name} (${p.symbol})` : nameCode(p.symbol);
    const dcls = /매도|축소|정리|손절/.test(p.decision || '') ? 'TSELL' : /매수|추매|확대/.test(p.decision || '') ? 'TBUY' : 'TWAIT';
    return `<div class="tgroup">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(nm)}</b>${p.kind === '신규' ? '<span class="pill">신규</span>' : ''}
        <span class="badge ${dcls}">${esc(p.decision || '-')}</span>${p.conviction ? `<span class="muted" style="font-size:12px">확신도 ${esc(p.conviction)}</span>` : ''}</div>
      ${p.thesis ? `<div style="font-size:13px;margin-top:4px;line-height:1.6">${esc(p.thesis)}</div>` : ''}
      ${liveLine}
      ${trades.length ? tradeLines(trades, /^[A-Z]/.test(p.symbol || '') ? 'USD' : 'KRW') : ''}
      ${p.vsRule ? `<div class="muted" style="font-size:12px;margin-top:4px"><b>규칙 계산 대비</b> · ${esc(p.vsRule)}</div>` : ''}
      ${p.invalidation ? `<div style="font-size:12px;margin-top:2px;color:var(--warn)"><b>철회 조건</b> · ${esc(p.invalidation)}</div>` : ''}
    </div>`;
  }).join('');
  // 추천·관찰 종목 판단: 공식 추천(09:30)과 장중 관찰 후보 전부 — 추천 시점 이후 흐름과 지금 진입할지
  const candNow = (sym) => {
    const a = (D.strategy?.actions || []).find((x) => x.symbol === sym && x.candidate);
    if (a) return { price: a.candidate.price, rule: a.action, at: D.strategy.updatedAt };
    const lp = (D.livePicks?.markets?.KR?.picks || []).concat(D.livePicks?.markets?.US?.picks || []).find((x) => x.symbol === sym);
    return lp ? { price: lp.last, rule: null, at: D.livePicks.markets[lp.market]?.updatedAt } : null;
  };
  const cands = (Array.isArray(A.candidates) ? A.candidates : []).map((c) => {
    const trades = Array.isArray(c.trades) ? c.trades : [];
    const usd = /^[A-Z]/.test(c.symbol || '');
    const m$ = (x) => usd ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(Number(x)).toLocaleString('ko-KR') + '원';
    const sg = (a, b) => { const g = (a / b - 1) * 100; return `${g > 0 ? '+' : ''}${g.toFixed(1)}%`; };
    const n = candNow(c.symbol);
    const nm = c.name ? `${c.name} (${c.symbol})` : nameCode(c.symbol);
    const dcls = /무효|제외|탈락/.test(c.decision || '') ? 'TSELL' : /지금|진입|매수/.test(c.decision || '') && !/보류|대기|관망|금지/.test(c.decision || '') ? 'TBUY' : 'TWAIT';
    const recLine = [c.source && esc(c.source), c.recommendedAt && `${esc(c.recommendedAt)} 편입`, c.entry && `진입가 ${m$(c.entry)}`, c.stop && `손절 ${m$(c.stop)}`, c.target && `목표 ${m$(c.target)}`].filter(Boolean).join(' · ');
    const liveLine = n?.price ? `<div style="font-size:12px;margin-top:4px"><b>지금</b> · 현재가 ${m$(n.price)}${c.entry ? ` (진입가 대비 ${sg(n.price, c.entry)})` : ''}${n.rule ? ` · 규칙 판정 ${esc(n.rule)}` : ''}</div>` : '';
    return `<div class="tgroup">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(nm)}</b>
        <span class="badge ${dcls}">${esc(c.decision || '-')}</span>${c.conviction ? `<span class="muted" style="font-size:12px">확신도 ${esc(c.conviction)}</span>` : ''}</div>
      ${recLine ? `<div class="muted" style="font-size:12px;margin-top:2px">${recLine}</div>` : ''}
      ${c.sinceRec ? `<div style="font-size:12px;margin-top:2px"><b>편입 이후</b> · ${esc(c.sinceRec)}</div>` : ''}
      ${c.thesis ? `<div style="font-size:13px;margin-top:4px;line-height:1.6">${esc(c.thesis)}</div>` : ''}
      ${liveLine}
      ${trades.length ? tradeLines(trades, usd ? 'USD' : 'KRW') : ''}
      ${c.vsRule ? `<div class="muted" style="font-size:12px;margin-top:4px"><b>규칙 계산 대비</b> · ${esc(c.vsRule)}</div>` : ''}
      ${c.invalidation ? `<div style="font-size:12px;margin-top:2px;color:var(--warn)"><b>철회 조건</b> · ${esc(c.invalidation)}</div>` : ''}
    </div>`;
  }).join('');
  const candBlock = cands ? `<div style="margin-top:10px"><b style="font-size:14px">추천·관찰 종목 — 지금 진입할까</b>
    <div class="muted" style="font-size:11px;margin-top:2px">오늘 공식 추천과 장중 관찰 후보 전부를, 편입 시점 이후 흐름과 지금 가격 기준으로 판단합니다.</div>${cands}</div>` : '';
  return `<div style="margin-top:10px;border:1px solid var(--border);border-radius:10px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:baseline"><b>전문가 관점 판단</b>
      <span class="muted" style="font-size:12px">${fresh ? '' : '<span class="pill">지난 판단</span> '}Cowork ${esc(A.session || '')} · ${when} 작성 (${ago})${A.dataAsOf ? ` · 데이터 ${esc(asOf)} 기준` : ''}</span></div>
    <div class="muted" style="font-size:11px;margin-top:2px">판단 문장은 작성 시점 기준입니다(평일 30분마다 갱신). 종목별 '지금' 줄(현재가·보유 수량·주문 가격까지 거리)과 아래 규칙 기반 계산은 5~5분마다 갱신됩니다.</div>
    ${A.headline ? `<div class="stance" style="margin-top:6px">${esc(A.headline)}</div>` : ''}
    ${A.stance ? `<div style="font-size:13px;margin-top:4px"><span class="muted">스탠스</span> <b>${esc(A.stance)}</b></div>` : ''}
    ${A.marketView ? `<p style="font-size:13px;margin:6px 0;line-height:1.6">${esc(A.marketView)}</p>` : ''}
    ${pos}
    ${candBlock}
    ${A.portfolio ? `<div style="font-size:13px;margin-top:6px"><b>포트폴리오</b> · ${esc(A.portfolio)}</div>` : ''}
    ${A.biasCheck ? `<div class="muted" style="font-size:12px;margin-top:4px"><b>행동재무 점검</b> · ${esc(A.biasCheck)}</div>` : ''}
    ${A.risks?.length ? `<ul class="flags" style="font-size:12px">${A.risks.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${A.sources?.length ? `<div class="muted" style="font-size:11px;margin-top:4px">출처: ${A.sources.map((s) => safeUrl(s.url) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title || s.url)}</a>` : esc(s.title || '')).join(' · ')}</div>` : ''}
    <p class="muted" style="font-size:11px;margin:6px 0 0">Claude(Cowork)가 데이터·뉴스를 바탕으로 '전문가라면 이렇게 판단할 것'을 정리한 분석입니다. Claude는 공인 투자자문업자가 아니며 투자 권유가 아닙니다. 결정과 주문은 토스증권 앱에서 직접.</p>
  </div>`;
}

const TWHEN = { now: '지금', limit: '지정가', close: '종가 확인', wait: '조건 대기', placed: '주문 접수' };
function executedLines(ex, currency) {
  const money = (x) => x == null ? '-' : currency === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(Number(x)).toLocaleString('ko-KR') + '원';
  return (ex || []).map((e) => '<div class="tline done"><span class="badge TDONE">' + (e.side === 'BUY' ? '매수' : '매도') + ' 체결</span><span class="what"><b>' + esc(e.qty) + '주</b> × ' + money(e.price) + '</span><span class="amt">오늘 ' + esc(e.time) + '</span></div>').join('');
}
function tradeLines(trades, currency) {
  const money = (x) => x == null || x === '' ? '-' : currency === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(Number(x)).toLocaleString('ko-KR') + '원';
  const man = (x) => x == null ? '' : '약 ' + Math.round(x / 1e4).toLocaleString('ko-KR') + '만원';
  const badge = (t) => t.when === 'placed' ? '<span class="badge TPLACED">' + (t.side === 'BUY' ? '매수' : '매도') + ' 주문중</span>' : t.when === 'wait' ? '<span class="badge TWAIT">' + (t.side === 'BUY' ? '매수' : '매도') + ' 대기</span>' : '<span class="badge ' + (t.side === 'BUY' ? 'TBUY' : 'TSELL') + '">' + (t.side === 'BUY' ? '매수' : '매도') + '</span>';
  return trades.map((t) => {
    const amt = t.amountKRW ?? (t.qty && t.price && currency !== 'USD' ? t.qty * t.price : null);
    return '<div class="tline">' + badge(t) + '<span class="what"><b>' + esc(t.qty) + '주</b> × ' + money(t.price) + '</span><span class="amt">' + man(amt) + '</span>'
      + '<div class="cond"><b>' + (TWHEN[t.when] || esc(t.when || '')) + '</b> · ' + esc(t.cond || '') + '</div>'
      + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') + '</div>';
  }).join('');
}

function tradePlan() {
  const S = D.strategy;
  const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  const live = S && S.date === today && S.actions?.some((a) => a.trades);
  // 장중 판정이 있으면 그것(시나리오 반영), 없으면 보유 종목 대응 옵션(5분마다 갱신)
  const acts = live ? S.actions.filter((a) => a.trades)
    : (D.playbooks?.list || []).map((b) => ({ target: nameCode(b.symbol), currency: b.currency, action: b.signal?.label || '보유', executed: b.today?.executed, watching: b.today?.watching, trades: b.today?.trades || (b.options.find((o) => o.key === b.recommended) || b.options[0])?.trades || [] }));
  // 미보유(추천·관찰) 종목은 지금 주문할 게 있을 때(지금·지정가)만 자세히 — 진입 보류는 이름만 한 줄
  const isPick = (a) => a.planQty !== undefined;
  const ready = (a) => a.trades.some((t) => t.when === 'now' || t.when === 'limit' || t.when === 'placed') || a.executed?.length;
  const waiting = acts.filter((a) => isPick(a) && a.trades.length && !ready(a));
  const rows = acts.filter((a) => (a.trades.length || a.executed?.length) && (!isPick(a) || ready(a)));
  if (!rows.length && !waiting.length) return '';
  const man = (x) => x == null ? '-' : '약 ' + Math.round(x / 1e4).toLocaleString('ko-KR') + '만원';
  const hm = (x) => new Date(x).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  const bp = live ? S.buyingPower : null;
  const body = rows.map((a) => '<div class="tgroup"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline"><b>' + esc(a.target) + '</b><span class="muted" style="font-size:12px">' + esc(a.action) + '</span></div>'
    + executedLines(a.executed, a.currency) + tradeLines(a.trades, a.currency)
    + (a.watching?.length ? '<div class="muted" style="font-size:11px;margin:4px 0 0 12px">' + a.watching.map((w) => esc(w)).join('<br>') + '</div>' : '')
    + (a.exitNote ? '<div class="muted" style="font-size:11px;margin:4px 0 0 12px">' + esc(a.exitNote) + '</div>' : '') + '</div>').join('');
  return '<div style="margin-top:10px">'
    + '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:baseline"><b>오늘의 매매 계획</b><span class="muted" style="font-size:12px">'
    + (live ? '시나리오 ' + esc(S.scenario) + ' · ' + hm(S.updatedAt) + ' 판정' : '보유 종목 대응 옵션 · ' + (D.playbooks?.updatedAt ? hm(D.playbooks.updatedAt) : '') + ' 기준 (추천 종목 진입은 국내 정규장 중 판정)') + '</span></div>'
    + (bp ? '<div class="muted" style="font-size:12px;margin:4px 0">매수 여력 <b>' + man(bp.budgetKRW) + '</b> = 현금 ' + man(bp.cashKRW) + (bp.sellNowKRW > 0 ? " + 오늘 '지금' 매도 " + man(bp.sellNowKRW) : '') + ' − 권장 현금(' + (bp.cashTargetPct ?? '-') + '%) ' + man(bp.reserveKRW) + '</div>' : '')
    + body
    + (waiting.length ? '<div class="muted" style="font-size:12px;margin-top:8px">진입 대기 ' + waiting.length + '종목 — ' + waiting.map((a) => esc(a.target.replace(/ · 관찰$/, ''))).join(', ') + ' · 진입 조건이 맞으면 여기에 수량·가격이 나옵니다</div>' : '')
    + "<p class=\"muted\" style=\"font-size:11px;margin:6px 0 0\">같은 종목의 '지정가'와 '종가 확인' 줄은 먼저 닿는 쪽 하나만 실행 · 신규 진입 수량 = 손절가까지 손실이 총자산 1% 이내, 1종목 10% 이내, 1차는 그 절반 · 조건 대기 매수는 조건이 맞은 것부터 매수 여력 안에서만 · 규칙 기반 자동 계산으로 참고용이며 투자 권유가 아닙니다.</p>"
    + '</div>';
}

// 보유 종목 실행 계획: 판단 + 몇 주 사고팔지 + 금액 + 비중 변화 + 분할 실행
function sigBox(g) {
  if (!g) return '';
  const money = (x, cur) => x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원';
  const r = g.returnPct;
  if (g.exempt) return `<div class="sig">
    <div><span class="k">수익률</span><b class="${cls(r)}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</b></div>
    <div><span class="k">본전 (평균가)</span><b>${money(g.breakevenPrice, g.currency)}</b></div>
    <div><span class="k">본전까지</span>${r >= 0 ? '도달' : '+' + ((g.avgPrice / g.lastPrice - 1) * 100).toFixed(1) + '%'}</div>
    <div><span class="k">규칙</span>예외${g.exempt.since ? ' (' + esc(g.exempt.since) + '~)' : ''}</div>
  </div>`;
  return `<div class="sig">
    <div><span class="k">수익률 (평균가 ${money(g.avgPrice, g.currency)})</span><b class="${cls(r)}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</b></div>
    <div><span class="k">손절가 (${g.stopLossPct}%)</span><b>${money(g.stopPrice, g.currency)}</b></div>
    <div><span class="k">손절 경고 (${g.stopWarnPct}%)</span>${money(g.warnPrice, g.currency)}</div>
    ${g.state === 'ADD_BUY' && g.addQty ? `<div><span class="k">지금 추매 수량</span><b>${g.addQty}주</b>${g.addAmountKRW ? ` (약 ${money(g.addAmountKRW, 'KRW')})` : ''}</div>` : ''}
    <div><span class="k">다음 추매가</span>${g.nextAddPrice != null ? `${money(g.nextAddPrice, g.currency)} (+${g.nextAddLevel}%)${g.nextAddQty ? ` · ${g.nextAddQty}주` : ''}` : '단계 모두 도달'}</div>
  </div>`;
}

// ---------- 다각도 분석·대응 옵션 (보유 종목별) ----------
function playbookOf(symbol) {
  return (D.playbooks?.list || D.view?.playbooks || []).find((b) => b.symbol === symbol) || null;
}
// 익절가(목표가) — 저항 마디·이동평균·직전 고점·ATR·손익비 근거로 1차·2차와 수량
function tpBlock(symbol) {
  const b = playbookOf(symbol), tp = b?.takeProfit;
  if (!tp?.steps?.length) return '';
  const m$ = (x) => b.currency === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원';
  const sg = (x) => `${x > 0 ? '+' : ''}${x}%`;
  // 손절 신호 상태면 익절가 대신 대응 옵션(반등 매도 목표·방어선)을 따른다 — 위쪽 저항만 참고로
  if (b.signal?.state === 'STOP_HIT') return `<div class="muted" style="font-size:12px;margin-top:8px"><b>익절·목표가</b> · 손절 신호 상태라 익절가 대신 아래 대응 옵션의 매도 목표를 따릅니다. 위쪽 저항 참고: ${tp.basis.slice(0, 3).map((x) => `${m$(x.value)}(${sg(x.gapPct)}, ${esc(x.name)})`).join(' · ')}</div>`;
  const rows = tp.steps.map((s) => `<div class="tline"><span class="badge ${s.kind === '익절' ? 'TBUY' : 'TWAIT'}">${s.step}차 ${esc(s.kind)}</span><span class="what"><b>${s.qty}주</b> × ${m$(s.price)}</span><span class="amt">${sg(s.gapPct)}</span><div class="cond">근거 · ${esc(s.basis)}</div></div>`).join('');
  return `<div style="margin-top:8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline"><b style="font-size:13px">익절·목표가</b>
      <span class="muted" style="font-size:12px">${tp.stopLine ? `손절선 ${m$(tp.stopLine)}` : ''}${tp.rr != null ? ` · 1차 손익비 ${tp.rr}:1` : ''}</span></div>
    ${rows}
    ${tp.notes?.length ? `<div class="muted" style="font-size:12px;margin:4px 0 0 12px">${tp.notes.map(esc).join('<br>')}</div>` : ''}
    ${tp.basis?.length ? `<details style="margin:2px 0 0 12px"><summary class="muted" style="cursor:pointer;font-size:12px">목표가 후보 ${tp.basis.length}개</summary><div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:4px">${tp.basis.map((x) => `<span>${m$(x.value)} <span class="muted">${sg(x.gapPct)} · ${esc(x.name)}</span></span>`).join('')}</div></details>` : ''}
  </div>`;
}
function playbookBlock(symbol) {
  const b = playbookOf(symbol);
  if (!b) return '';
  const chip = (l) => `<span class="pill" title="${esc(l.note)}" style="border-color:${l.score > 0 ? 'var(--up)' : l.score < 0 ? 'var(--down)' : 'var(--border)'}">${esc(l.name)} ${l.score > 0 ? '+' : ''}${l.score}</span>`;
  const rec = b.options.find((o) => o.key === b.recommended);
  const opt = (o) => `<div class="item" style="padding:6px 0">${o.key === b.recommended ? '<span class="badge ADD_BUY">추천</span> ' : ''}<b>${esc(o.title)}</b>
      <div style="font-size:13px">${o.steps.map((s) => esc(s)).join('<br>')}</div>
      <div class="muted" style="font-size:12px">장점: ${esc(o.pros)} · 단점: ${esc(o.cons)}</div></div>`;
  const others = b.options.filter((o) => o.key !== b.recommended);
  return `<div style="margin-top:8px">
    <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px"><span class="muted">다각도 분석</span> ${b.lenses.map(chip).join(' ')} <b style="margin-left:4px">종합 ${esc(b.consensus.label)} (${b.consensus.score > 0 ? '+' : ''}${b.consensus.score})</b></div>
    ${rec ? `<div style="margin-top:6px">${opt(rec)}${b.why ? `<div class="muted" style="font-size:12px">추천 이유: ${esc(b.why)}</div>` : ''}</div>` : ''}
    ${others.length ? `<details style="margin-top:4px"><summary class="muted" style="cursor:pointer;font-size:12px">다른 대응 옵션 ${others.length}개 · 관점별 근거</summary>
      ${others.map(opt).join('')}
      <ul class="flags" style="font-size:12px">${b.lenses.map((l) => `<li><b>${esc(l.name)}</b> ${esc(l.note)}</li>`).join('')}</ul></details>` : ''}
  </div>`;
}

function holdingPlansCard(v) {
  const plans = v.holdingPlans?.items || [];
  const money = (x, cur) => cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원';
  // 지금 보유 중인 종목 기준 (아침 리포트 이후 전량 매도한 종목은 빼고, 새로 산 종목은 넣는다)
  const liveItems = D.portfolio?.items || [];
  const held = (sym) => liveItems.find((i) => i.symbol === sym);
  const soldOut = v.holdings.filter((h) => !held(h.symbol));
  const list = [...v.holdings.filter((h) => held(h.symbol)), ...liveItems.filter((i) => !v.holdings.some((h) => h.symbol === i.symbol)).map((i) => ({ symbol: i.symbol, view: '-', reason: '', isNew: true }))];
  let traded = soldOut.length > 0;
  const rows = list.map((h) => {
    const p0 = plans.find((x) => x.symbol === h.symbol);
    const qtyNow = held(h.symbol)?.quantity;
    const qtyChanged = !!p0 && qtyNow != null && p0.currentQty !== qtyNow;
    if (qtyChanged || h.isNew) traded = true;
    const p = qtyChanged ? null : p0; // 리포트 이후 수량이 바뀌었으면 리포트의 수량 계획은 쓰지 않음
    const act = !p || p.delta === 0 ? '<span class="badge">유지</span>'
      : `<span class="badge ${p.delta < 0 ? 'SELL' : 'BUY'}">${Math.abs(p.delta)}주 ${p.action}</span>`;
    const split = p && Math.abs(p.firstStep) !== Math.abs(p.delta)
      ? ` · 나눠서 실행: 1차 ${Math.abs(p.firstStep)}주, 이후 ${Math.abs(p.delta) - Math.abs(p.firstStep)}주` : '';
    const detail = p ? `<div class="plan">
        <div><b>${p.currentQty}주 → ${p.targetQty}주</b>${p.delta ? ` · 약 ${money(p.amount, p.currency)} (현재가 ${money(p.price, p.currency)})` : ''}</div>
        <div class="muted">비중 ${pctAbs(p.weightBefore)} → ${pctAbs(p.weightAfter)}${split}${p.limitedByCash ? ' · 현금 한도로 축소됨' : ''}</div>
      </div>` : '';
    // 실시간 신호(5분 갱신)를 우선 — 아침 리포트 이후 상태가 바뀌었으면 리포트의 수량 계획 대신 대응 옵션을 보도록 안내
    const live = playbookOf(h.symbol)?.signal;
    const sig = live?.state ? live : h.signal;
    const changed = (live?.state && h.signal?.state && live.state !== h.signal.state) || qtyChanged || h.isNew;
    const why = h.isNew ? '아침 리포트 이후 새로 산 종목입니다' : qtyChanged ? `아침 리포트 이후 수량이 ${p0.currentQty}주 → ${qtyNow}주로 바뀌었습니다` : `아침 리포트 이후 상태가 ${live?.label}(으)로 바뀌었습니다`;
    return `<div class="item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(nameCode(h.symbol))}</b> ${changed ? '' : `<span class="pill">${esc(h.view)}</span> ${act}`} ${sig ? `<span class="badge ${sig.state}">${esc(sig.label)}</span>` : ''}${live ? ' <span class="pill">실시간</span>' : ''}</div>${sigBox(sig)}
      ${changed ? `<p class="muted" style="font-size:12px;margin:6px 0 0">${esc(why)} — 리포트의 수량 계획 대신 아래 대응 옵션을 참고하세요. 수량 계획은 다음 리포트(15:45 마감 리포트)에서 갱신됩니다.</p>` : detail}
      ${tpBlock(h.symbol)}${playbookBlock(h.symbol)}${changed ? '' : `<div style="margin-top:4px">${esc(h.reason)}</div>`}</div>`;
  }).join('');
  const hp = v.holdingPlans;
  const s = D.portfolio?.summary;
  const done = soldOut.length ? `<p class="muted" style="font-size:13px;margin:10px 0 0">오늘 매도 완료: ${soldOut.map((h) => { const nm = plans.find((x) => x.symbol === h.symbol)?.name || (D.orders?.recentOrders || []).find((o) => o.symbol === h.symbol)?.name; return esc(nm ? nm + ' (' + h.symbol + ')' : nameCode(h.symbol)); }).join(', ')}</p>` : '';
  if (!rows && !done) return '';
  // 리포트 이후 매매가 있었으면 리포트의 '조정 후 현금' 대신 지금 현금
  const foot = traded && s ? `<p class="muted" style="font-size:13px;margin:10px 0 0">지금 현금 약 ${won(s.cashTotalKRW)} (${pctAbs(s.cashRatio)}${hp ? `, 권장 ${hp.basis.cashTargetPct}%` : ''}) · 아침 리포트 이후 매매 반영</p>`
    : hp ? `<p class="muted" style="font-size:13px;margin:10px 0 0">조정 후 현금 약 ${won(hp.cashAfterKRW)} (${pctAbs(hp.cashRatioAfter)}, 권장 ${hp.basis.cashTargetPct}%) · 단일 종목 한도 ${hp.basis.singlePositionCapPct}% 기준 · 실제 체결가에 따라 달라질 수 있습니다.</p>` : '';
  const note = hp?.note ? `<p style="font-size:13px;margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:var(--surface);border-radius:0 8px 8px 0">${esc(hp.note)}</p>` : '';
  return `<section class="card"><h2>보유 종목 실행 계획 <span class="pill">현재가 기준</span></h2>${rows}${done}${foot}${traded ? '' : note}</section>`;
}

// 장중 투자 방향 — PC 가 5분마다 시장 국면 점수로 다시 판단 (리포트와 같은 규칙)
function stanceKpi(v) {
  const L = D.markets?.liveStance;
  if (!L) return kpi('투자 방향', esc(v?.strategy?.stance ?? '-'), v ? esc(v.strategy.krUsSplit) : '');
  const changed = v && v.strategy.stance !== L.stance;
  return kpi('투자 방향 <span class="pill">장중</span>', esc(L.stance),
    `권장 현금 ${L.cashTargetPct}% · ${kst(L.updatedAt)}${changed ? `<br><span class="WARN">아침 리포트: ${esc(v.strategy.stance)} → 변경</span>` : ''}`);
}
function liveStanceLine(v) {
  const L = D.markets?.liveStance;
  if (!L) return '';
  const changed = v.strategy.stance !== L.stance;
  return `<div class="plan" style="margin:0 0 10px">
    <b>장중 판단 (${kst(L.updatedAt)}): ${esc(L.stance)}</b> · 권장 현금 ${L.cashTargetPct}% · ${esc(L.krUsSplit)}
    <div class="muted">시장 국면 점수 국내 ${L.krScore} / 미국 ${L.usScore} (평균 ${L.score}) · ${kst(L.since)}부터 유지${changed ? ` · <span class="WARN">리포트(${esc(v.strategy.stance)})에서 바뀜</span>` : ' · 리포트와 동일'}</div>
  </div>`;
}

const trendKo = (t) => ({ UP: '상승', DOWN: '하락', SIDEWAYS: '횡보' })[t] ?? t ?? '-';
const sessionKo = (s) => ({ KR: '국내장', US: '미국장', KRC: '국내장 마감' })[s] || s;
// 종목명 (종목번호) — 이름을 모르는 코드는 코드만
const nameCode = (sym) => { const n = nameOf(sym); return n && n !== sym ? `${n} (${sym})` : sym; };
const kpi = (l, v, n) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
const nameOf = (sym) => D.portfolio?.items?.find((i) => i.symbol === sym)?.name || D.candidates?.find((c) => c.symbol === sym)?.name || sym;

function holdingsTable(items) {
  if (!items?.length) return '<div class="empty">보유 종목 없음</div>';
  return `<table><thead><tr><th>종목</th><th>손익률</th><th>오늘</th><th>추세</th><th>RSI</th><th>수량</th><th>평균가</th><th>현재가</th><th>평가금액</th><th>비중</th></tr></thead><tbody>${
    items.map((h) => `<tr><td>${esc(h.name)} <span class="muted">${esc(h.symbol)}</span></td><td class="${cls(h.plRate)}"><b>${pct(h.plRate)}</b></td><td class="${cls(h.dailyRate)}"><b>${pct(h.dailyRate)}</b></td><td><b>${trendKo(h.trend)}</b></td><td><b>${h.rsi14 != null ? h.rsi14.toFixed(0) : '-'}</b></td><td>${h.quantity}</td><td>${price(h.avgPrice, h.currency)}</td><td>${price(h.lastPrice, h.currency)}</td><td>${won(h.valueKRW)}</td><td>${pctAbs(h.weight)}</td></tr>`).join('')

      <td>${p.score}${p.scoreChange ? ` <span class="${cls(p.scoreChange)}">(${p.scoreChange > 0 ? '+' : ''}${p.scoreChange})</span>` : ''}</td>

      ${m.picks.length ? `<div class="scroll"><table><thead><tr><th>종목</th><th>점수</th><th>확신도</th><th>현재가</th><th>오늘</th><th>손절가</th><th>목표가</th><th>RSI</th><th>후보 편입 (편입가·이후)</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">기준을 충족한 종목이 없습니다.</div>'}

  };

// ---------- 뉴스·공시 ----------
let nFilter = 'all';
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 60 ? `${Math.max(1, m)}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`;
}
function news() {
  const N = D.news;
  if (!N) return '<div class="card empty">뉴스가 아직 수집되지 않았습니다. PC 에이전트가 30분마다 수집합니다.</div>';
  const chips = [['all', '전체'], ['holding', '보유 종목'], ['pick', '추천·관찰'], ['market', '시장'], ...(N.dartEnabled ? [['disc', '공시만']] : [])];
  return `<div class="jtools" style="margin-bottom:4px">
      ${chips.map(([k, l]) => `<button class="chip ${nFilter === k ? 'on' : ''}" data-nf="${k}">${l}</button>`).join('')}
    </div>
    <div class="muted" style="font-size:12px">${kst(N.updatedAt)} 기준 · 뉴스 최근 24시간(Google 뉴스, 해외 종목도 한국어 기사 우선)${N.dartEnabled ? ' · 공시 최근 7일(DART)' : ''}</div>
    <div id="nlist" class="ngrid"></div>`;
}
function newsList() {
  const N = D.news;
  const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`;
  const art = (a) => `<div class="nitem">${a.lang === 'en' ? '<span class="pill">영문</span> ' : ''}${link(a.link, a.title)}<div class="meta">${esc(a.source)} · ${ago(a.publishedAt)}</div></div>`;
  const disc = (d) => `<div class="nitem"><span class="badge ${d.important ? 'DISC_IMP' : 'DISC'}">${d.important ? '중요 공시' : '공시'}</span> ${link(d.link, d.title)}<div class="meta">${esc(d.date)} · ${esc(d.filer)}</div></div>`;
  const cards = [];
  if (nFilter !== 'market') {
    for (const g of N.groups) {
      if (nFilter === 'holding' && g.type !== 'holding') continue;
      if (nFilter === 'pick' && g.type !== 'pick') continue;
      const ds = g.disclosures || [];
      if (nFilter === 'disc' && !ds.length) continue;
      const body = (nFilter === 'disc' ? ds.map(disc) : [...ds.map(disc), ...g.news.map(art)]).join('') || '<div class="empty" style="padding:8px 0">최근 뉴스·공시 없음</div>';
      const imp = ds.filter((d) => d.important).length;
      cards.push(`<section class="card"><h2><span>${esc(g.name)} <span class="muted" style="font-weight:400">${esc(g.symbol)}</span></span>
        <span><span class="pill">${g.type === 'holding' ? '보유' : '추천·관찰'}</span>${imp ? ` <span class="badge DISC_IMP">중요 공시 ${imp}</span>` : ''}</span></h2>${body}</section>`);
    }
  }
  if (nFilter === 'all' || nFilter === 'market') {
    for (const m of N.market) cards.push(`<section class="card"><h2>${esc(m.label)} <span class="pill">시장</span></h2>${m.news.map(art).join('') || '<div class="empty">뉴스 없음</div>'}</section>`);
  }
  return cards.join('') || '<div class="card empty">해당하는 항목이 없습니다.</div>';
}
function bindNews() {
  const draw = () => { $('#nlist').innerHTML = newsList(); };

    nFilter = c.dataset.nf; document.querySelectorAll('.chip[data-nf]').forEach((x) => x.classList.toggle('on', x === c)); draw();

// ---------- 내 주문 (조회 전용) ----------
let oFilter = 'all';
function moneyC(x, cur) { return x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원'; }
function orders() {
  const O = D.orders;
  if (!O) return '<div class="card empty">주문 정보가 아직 수집되지 않았습니다. PC 에이전트가 5분마다 갱신합니다.</div>';
  const fee = O.commissions.map((c) => `<div class="kpi"><div class="l">${c.market === 'KR' ? '국내' : '미국'} 매매 수수료</div><div class="v">${(c.rate * 100).toFixed(3)}%</div>
    <div class="n">${c.endDate && c.endDate < '9999' ? `${esc(c.endDate)}까지${c.endingSoon ? ' <span class="WARN">· 곧 종료</span>' : ''}` : '기한 없음'}</div></div>`).join('');
  const sell = O.sellable.map((s) => `<div class="kpi"><div class="l">${esc(s.name)} (${esc(s.symbol)}) 매도 가능</div><div class="v">${s.sellable}주</div>
    <div class="n">보유 ${s.holding}주${s.sellable < s.holding ? ' <span class="WARN">· 일부가 미체결 매도 주문에 묶여 있음</span>' : ''}</div></div>`).join('');
  const heldNoCond = (D.portfolio?.items || []).filter((h) => !O.conditionalOpen.some((c) => c.symbol === h.symbol));
  // 이미 다 판 종목의 조건주문(토스가 '일시 정지')은 목록에서 빼고 한 줄로만
  const isHeld = (sym) => !D.portfolio?.items || D.portfolio.items.some((h) => h.symbol === sym);

  <section class="card"><h2>미체결 주문 <span class="pill">${O.openOrders.length}건</span></h2>${O.openOrders.length ? orderTable(O.openOrders, true) : '<div class="empty">걸려 있는 주문이 없습니다.</div>'}</section>
  <section class="card"><h2>조건주문 — 감시 중 <span class="pill">${condActive.length}건</span></h2>
    ${condActive.length ? condTable(condActive) : '<div class="empty">감시 중인 조건주문이 없습니다.</div>'}
    ${condOrphan.length ? `<p class="muted" style="font-size:12px;margin:8px 0 0">보유하지 않은 종목의 조건주문 ${condOrphan.length}건 (${[...new Set(condOrphan.map((c) => `${c.name} · ${c.status}`))].map(esc).join(', ')}) — 다 판 종목이라 목록에서 뺐습니다. 다시 사면 발동될 수 있으니 필요 없으면 토스증권 앱에서 취소하세요.</p>` : ''}
    ${heldNoCond.length ? `<p class="muted" style="font-size:12px;margin:8px 0 0">조건주문이 걸려 있지 않은 보유 종목: ${heldNoCond.map((h) => esc(h.name)).join(', ')} — 토스증권 앱의 조건주문(손절·익절 감시)으로 걸어두면 자리를 비워도 자동 실행됩니다.</p>` : ''}
  </section>
  <section class="card"><h2>최근 주문·체결 <span class="pill">최근 ${O.recentOrders.length}건</span></h2>
    <div class="jtools" style="margin-bottom:6px">${[['all', '전체'], ['filled', '체결된 것만']].map(([k, l]) => `<button class="chip ${oFilter === k ? 'on' : ''}" data-of="${k}">${l}</button>`).join('')}</div>
    <div id="olist" class="scroll list"></div></section>
  ${O.conditionalRecent.length ? `<section class="card"><h2>지난 조건주문</h2>${condTable(O.conditionalRecent)}</section>` : ''}
  <p class="muted" style="font-size:12px">${kst(O.updatedAt)} 기준 · 조회 전용(주문·취소는 토스증권 앱에서)</p>`;
}
function orderTable(list, open) {
  return `<div class="scroll"><table><thead><tr><th>주문 시각</th><th>종목</th><th>구분</th><th>유형</th><th>주문가</th><th>수량</th><th>체결</th><th>체결가</th><th>상태</th>${open ? '' : '<th>수수료·세금</th>'}</tr></thead><tbody>${

function condTable(list) {

function bindOrders() {

// 단일 시리즈 선 차트 + 크로스헤어 툴팁 (범례 없음 — 제목이 시리즈 이름)
function lineChart(el, data, { fmtY = (v) => v, fmtX = (x) => x, tipX = fmtX, markers = false, H = 200 } = {}) {
  if (!el || data.length < 2) { if (el) el.innerHTML = '<div class="empty">데이터 부족</div>'; return; }
  const W = 560, P = { l: 56, r: 14, t: 12, b: 24 };
  const vs = data.map((d) => d.y), min = Math.min(...vs), max = Math.max(...vs), pad = (max - min) * 0.12 || Math.abs(max) * 0.01 || 1;
  const y0 = min - pad, y1 = max + pad;
  const X = (i) => P.l + (i / (data.length - 1)) * (W - P.l - P.r);
  const Y = (v) => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = [0, 1, 2, 3].map((i) => y0 + (i / 3) * (y1 - y0));
  const xl = markers && data.length <= 8 ? data.map((_, i) => i) : [...new Set([0, Math.floor((data.length - 1) / 2), data.length - 1])];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css('--grid')}"/><text x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${css('--muted')}">${fmtY(t)}</text>`).join('')}
    ${xl.map((i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${markers ? 'middle' : i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}" font-size="11" fill="${css('--muted')}">${fmtX(data[i].x)}</text>`).join('')}
    <path d="${data.map((d, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(d.y).toFixed(1)}`).join('')}" fill="none" stroke="${css('--line')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markers ? data.map((d, i) => `<circle cx="${X(i)}" cy="${Y(d.y)}" r="4" fill="${css('--line')}" stroke="${css('--card')}" stroke-width="2"/>`).join('') : ''}
    <line class="hx" y1="${P.t}" y2="${H - P.b}" stroke="${css('--axis')}" visibility="hidden"/>
    <circle class="hc" r="4" fill="${css('--line')}" stroke="${css('--card')}" stroke-width="2" visibility="hidden"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), hx = svg.querySelector('.hx'), hc = svg.querySelector('.hc');
  svg.addEventListener('pointermove', (ev) => {
    const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(data.length - 1, Math.round(((sx - P.l) / (W - P.l - P.r)) * (data.length - 1))));
    hx.setAttribute('x1', X(i)); hx.setAttribute('x2', X(i)); hx.setAttribute('visibility', 'visible');
    hc.setAttribute('cx', X(i)); hc.setAttribute('cy', Y(data[i].y)); hc.setAttribute('visibility', 'visible');
    tip.style.display = 'block'; tip.innerHTML = `<div class="muted">${tipX(data[i].x)}</div><b>${fmtY(data[i].y)}</b>`;
    tip.style.left = Math.min((X(i) / W) * r.width + 12, r.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; hx.setAttribute('visibility', 'hidden'); hc.setAttribute('visibility', 'hidden'); });
}

// ---------- 핵심 마디 (지지·저항 사다리) ----------
function levelsCard() {
  const LV = D.markets?.kr?.levels;
  if (!LV) return '';
  const fmt = (v) => v == null ? '-' : Math.round(v).toLocaleString('ko-KR');
  const one = (name, L) => {
    if (!L) return '';
    const res = [...(L.resistances || [])].reverse(); // 먼 저항이 위로
    const row = (kind, m) => `<tr><td><span class="badge ${kind === '저항' ? 'BUY' : 'SELL'}">${kind}</span></td><td><b>${fmt(m.value)}</b></td><td style="text-align:left">${esc(m.name)}</td><td class="${cls(m.gapPct)}">${m.gapPct > 0 ? '+' : ''}${m.gapPct.toFixed(1)}%</td></tr>`;
    const dayCh = L.prevClose ? L.last / L.prevClose - 1 : null;
    return `<section class="card"><h2>${name} 핵심 마디 <span class="pill">${esc(L.date)} 기준</span></h2>
      <div class="scroll"><table><thead><tr><th>구분</th><th>가격</th><th style="text-align:left">근거</th><th>현재가 대비</th></tr></thead><tbody>
        ${res.map((m) => row('저항', m)).join('')}
        <tr style="background:var(--surface)"><td><span class="badge ADD_BUY">현재</span></td><td><b>${fmt(L.last)}</b></td><td style="text-align:left">시가 ${fmt(L.open)} · 고가 ${fmt(L.high)} · 저가 ${fmt(L.low)}</td><td class="${cls(dayCh)}">${pct(dayCh, 1)}</td></tr>
        ${(L.supports || []).map((m) => row('지지', m)).join('')}
      </tbody></table></div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">20일선 ${fmt(L.ma20)} · 60일선 ${fmt(L.ma60)} · 120일선 ${fmt(L.ma120)} · 20일 박스 ${fmt(L.box20?.low)}~${fmt(L.box20?.high)} · 60일 박스 ${fmt(L.box60?.low)}~${fmt(L.box60?.high)}</p>

}

// ---------- 시간대별 투자자 수급 (당일 누적, 5분마다 기록) ----------
function flowsIntradayCard() {
  const F = D.markets?.kr?.flowsIntraday;
  if (!F?.points?.length) return '';
  const base = D.markets?.kr?.flowBaseline || {};
  const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  const one = (key, name) => {
    const pts = F.points.filter((p) => p[key]);
    if (!pts.length) return '';
    const b = base[key];
    const last = pts.at(-1)[key];
    const ratio = b?.foreignAvgAbs ? Math.abs(last.foreign) / b.foreignAvgAbs : null;
    return `<section class="card"><h2>${name} 시간대별 수급 <span class="pill">${esc(F.date)} 누적</span></h2>
      <div class="muted" style="font-size:12px;margin:-4px 0 8px">외국인 최근 일평균 규모 ${b?.foreignAvgAbs ? eok(b.foreignAvgAbs).replace('+', '') : '-'}${ratio != null ? ` · 현재 외국인 누적은 그 ${(ratio * 100).toFixed(0)}%` : ''}</div>
      <div class="scroll list" style="max-height:320px"><table><thead><tr><th>시각</th><th>외국인</th><th>기관</th><th>개인</th><th>연기금</th></tr></thead><tbody>${
        [...pts].reverse().map((p) => `<tr><td>${hm(p.t)}</td><td class="${cls(p[key].foreign)}">${eok(p[key].foreign)}</td><td class="${cls(p[key].institution)}">${eok(p[key].institution)}</td><td class="${cls(p[key].individual)}">${eok(p[key].individual)}</td><td class="${cls(p[key].pension)}">${eok(p[key].pension)}</td></tr>`).join('')
      }</tbody></table></div></section>`;
  };
  return `<div class="grid2e">${one('KOSPI', '코스피')}${one('KOSDAQ', '코스닥')}</div>`;
}

const ALERT_LABELS = { UP: '급등', DOWN: '급락', BIG: '급변', STOP: '추천 손절가 도달', TARGET: '추천 목표가 도달', LOSS: '손실 경고', STOP_LOSS: '보유 손절 신호', STOP_WARN: '보유 손절 임박', ADD_BUY: '보유 추매 신호', BREAKEVEN: '본전 도달', NEW_PICK: '장중 후보 신규', DROP_PICK: '장중 후보 탈락', STANCE: '투자 방향 변경', DISCLOSURE: '중요 공시', SCENARIO: '대응 시나리오 변경' };
let jKind = 'ALL', jText = '';

function journal() {
  const kinds = [...new Set(D.journal.map((j) => j.kind))];
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  return `<div class="jwrap">
    <div class="jtools">
      ${['ALL', ...kinds].map((k) => `<button class="chip ${jKind === k ? 'on' : ''}" data-kind="${esc(k)}">${k === 'ALL' ? '전체 ' + D.journal.length : esc(label(k)) + ' ' + D.journal.filter((j) => j.kind === k).length}</button>`).join('')}
      <input id="jsearch" type="search" placeholder="일지 검색 (종목, 키워드)" value="${esc(jText)}">
    </div>
    <div id="jlist"></div>
  </div>`;
}

function journalList() {
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  const q = jText.trim().toLowerCase();
  const rows = D.journal.filter((j) => (jKind === 'ALL' || j.kind === jKind) && (!q || (j.body + ' ' + (j.symbol || '') + ' ' + nameOf(j.symbol)).toLowerCase().includes(q)));
  if (!rows.length) return '<div class="card empty">조건에 맞는 일지가 없습니다.</div>';
  const day = (iso) => new Date(iso).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  const time = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
  let html = '', last = '';
  for (const j of rows) {
    const d = day(j.created_at);
    if (d !== last) { html += `<div class="jday">${d}</div>`; last = d; }
    const md = window.journalToMarkdown ? journalToMarkdown(j.body) : j.body;
    const body = withNames(marked.parse(esc(md)));
    const long = md.length > 420;
    html += `<article class="jentry">
      <div class="jhead"><span class="badge ${esc(j.kind)}">${esc(label(j.kind))}</span><span class="time">${time(j.created_at)}</span>${j.symbol ? `<span>· ${esc(nameOf(j.symbol))} ${nameOf(j.symbol) !== j.symbol ? esc(j.symbol) : ''}</span>` : ''}</div>
      <div class="jbody ${long ? 'clamp' : ''}">${body}</div>
      ${long ? '<button class="jmore">더 보기 ▾</button>' : ''}
    </article>`;
  }
  return html;
}

// 본문 속 종목코드(6자리)·티커 옆에 종목명을 붙인다 (보유·추천 목록에 있는 것만)
function withNames(html) {
  const known = new Map([...(D.portfolio?.items || []), ...(D.candidates || [])].map((x) => [x.symbol, x.name]));
  return html.replace(/(?<![(\w])([0-9][0-9A-Z]{5}|[A-Z]{2,5})\b(?![^<]*>)/g, (m) => known.has(m) && known.get(m) !== m ? `${known.get(m)}(${m})` : m);
}

function bindJournal() {
  const draw = () => {
    $('#jlist').innerHTML = journalList();
    document.querySelectorAll('.jmore').forEach((b) => b.addEventListener('click', () => {
      const body = b.previousElementSibling; const open = body.classList.toggle('clamp');
      b.textContent = open ? '더 보기 ▾' : '접기 ▴';
    }));
  };
  document.querySelectorAll('.chip[data-kind]').forEach((c) => c.addEventListener('click', () => {
    jKind = c.dataset.kind; document.querySelectorAll('.chip[data-kind]').forEach((x) => x.classList.toggle('on', x === c)); draw();
  }));
  $('#jsearch').addEventListener('input', (e) => { jText = e.target.value; draw(); });
  draw();
}

function alerts() {
  if (!D.alerts.length) return '<div class="card empty">알림이 없습니다.</div>';
  return `<section class="card"><h2>실시간 알림 <span class="pill">${D.alerts.length}건</span></h2><div class="scroll"><table>
    <thead><tr><th>시각</th><th>종류</th><th style="text-align:left">내용</th></tr></thead><tbody>${
      D.alerts.map((a) => `<tr><td>${kst(a.created_at)}</td><td>${esc(ALERT_LABELS[a.kind] || a.kind)}</td><td class="wrap">${esc(a.message)}</td></tr>`).join('')
    }</tbody></table></div></section>`;
}

// ---------- 차트: 총자산 추이 — 오늘(장중, 5분 간격) / 일별 ----------
let histMode = null;
function historyChart() {
  const el = $('#hist'); if (!el) return;
  const intra = (D.intraday || []).map((r) => ({ x: r.ts, y: r.total_value_krw }));
  const daily = (D.history || []).map((r) => ({ x: r.date, y: r.total_value_krw }));
  histMode ??= intra.length >= 2 ? 'intra' : 'daily';
  const chips = $('#histChips');
  if (chips) {
    chips.innerHTML = [['intra', '오늘(장중)'], ['daily', '일별']].map(([k, l]) => `<button class="chip ${histMode === k ? 'on' : ''}" data-hm="${k}" style="padding:2px 10px;font-size:12px">${l}</button>`).join(' ');
    chips.querySelectorAll('[data-hm]').forEach((b) => b.addEventListener('click', () => { histMode = b.dataset.hm; historyChart(); }));
  }
  const data = histMode === 'intra' ? intra : daily;
  const sub = $('#histSub');
  if (data.length < 2) {
    if (sub) sub.textContent = '';
    el.innerHTML = `<div class="empty">${histMode === 'intra' ? '장중 기록이 쌓이는 중입니다 (5분마다).' : '일별 기록이 2일 이상 쌓이면 추이가 표시됩니다.'}<br><b style="color:var(--ink)">${won(data.at(-1)?.y ?? D.portfolio?.summary?.totalValueKRW)}</b></div>`;
    return;
  }
  const first = data[0], last = data.at(-1), ch = last.y / first.y - 1;
  const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  if (sub) sub.innerHTML = histMode === 'intra'
    ? `${new Date(first.x).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' })} ${hm(first.x)} → ${hm(last.x)} · <span class="${cls(ch)}">${pct(ch)} (${won(last.y - first.y).replace(/^(?!-)/, last.y >= first.y ? '+' : '')})</span>`
    : `${first.x} → ${last.x} · <span class="${cls(ch)}">${pct(ch)}</span> · 오늘 값은 5분마다 갱신`;
  lineChart(el, data, histMode === 'intra'
    ? { fmtY: (v) => manwon(v), fmtX: hm, tipX: (t) => kst(t), H: 220 }
    : { fmtY: (v) => manwon(v), fmtX: (d) => d.slice(5), tipX: (d) => d, markers: data.length <= 31, H: 220 });
}

// ---------- 차트: 자산 구성 (단일 색 막대, 현금은 회색) ----------
function allocChart() {
  const el = $('#alloc'); if (!el) return;
  const s = D.portfolio.summary;
  const rows = [...D.portfolio.items.map((h) => ({ name: h.name, w: h.weight, v: h.valueKRW })), { name: '현금', w: s.cashRatio, v: s.cashTotalKRW, cash: true }].filter((r) => r.w > 0.001);
  if (!rows.length) { el.innerHTML = '<div class="empty">자산 없음</div>'; return; }
  const W = 360, rowH = 30, P = { l: 92, r: 52 }, H = rows.length * rowH + 4, max = Math.max(...rows.map((r) => r.w));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="자산 구성 비중">${rows.map((r, i) => {
    const w = Math.max(2, (r.w / max) * (W - P.l - P.r)), y = i * rowH + 6;
    return `<g><title>${esc(r.name)} ${(r.w * 100).toFixed(1)}% · ${won(r.v)}</title>
      <text x="${P.l - 8}" y="${y + 13}" text-anchor="end" font-size="12" fill="${css('--ink2')}">${esc(r.name.length > 9 ? r.name.slice(0, 8) + '…' : r.name)}</text>
      <rect x="${P.l}" y="${y}" width="${w}" height="18" rx="4" fill="${r.cash ? css('--bar-cash') : css('--bar')}"/>
      <text x="${P.l + w + 6}" y="${y + 13}" font-size="12" fill="${css('--ink')}">${(r.w * 100).toFixed(1)}%</text></g>`;
  }).join('')}</svg>`;
}
