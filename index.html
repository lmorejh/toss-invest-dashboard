<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🔒 내 투자 대시보드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%232a78d6%22%2F%3E%3Cpath%20d%3D%22M12%2046%20L26%2032%20L36%2040%20L52%2020%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2220%22%20r%3D%225%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="journal-format.js"></script>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --line: #2a78d6; --bar: #2a78d6; --bar-cash: #c3c2b7;
  --up: #d03b3b; --down: #1c5cab; --warn: #b26b00; --border: #e6e5df; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --surface: #1a1a19; --card: #161615; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --line: #3987e5; --bar: #3987e5; --bar-cash: #52514e;
    --up: #e66767; --down: #6da7ec; --warn: #fab219; --border: #2c2c2a; --accent: #3987e5; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

/* 잠금 화면 */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; display: grid; gap: 12px; }
#lock h1 { font-size: 18px; margin: 0; }
#lock .err { color: var(--up); font-size: 13px; min-height: 18px; }

/* 레이아웃 */
header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border); }
.bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.bar h1 { font-size: 17px; margin: 0; }
nav { max-width: 1280px; margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 12px; color: var(--ink2); white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; color: var(--ink2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.grid2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .grid2, .grid2e { grid-template-columns: 1fr; } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: clamp(17px, 2vw, 22px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .n { color: var(--ink2); font-size: 12px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.wrap { white-space: normal; text-align: left; min-width: 220px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; color: var(--ink2); }
ul.flags { margin: 10px 0 0; padding-left: 18px; } ul.flags li { margin: 3px 0; }
.WARN { color: var(--warn); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none; white-space: nowrap; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
.report { overflow-x: auto; }
.report h1 { font-size: 18px; } .report h2 { font-size: 16px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 20px; } .report h3 { font-size: 14px; }
.report blockquote { margin: 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; }
.report table { margin: 8px 0; font-size: 13px; }
.item { padding: 9px 0; border-bottom: 1px solid var(--border); }
.item .meta { color: var(--muted); font-size: 11px; }
.list { max-height: 640px; overflow-y: auto; }
.stance { font-size: 15px; font-weight: 600; }
.hidden { display: none !important; }
.ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .ngrid { grid-template-columns: 1fr; } }
.nitem { padding: 8px 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
.nitem:last-child { border-bottom: 0; }
.nitem a { color: var(--ink); text-decoration: none; }
.nitem a:hover { text-decoration: underline; }
.nitem .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
.badge.DISC { border-color: var(--warn); color: var(--warn); }
.badge.DISC_IMP { background: var(--warn); border-color: var(--warn); color: #fff; }
.sig { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.sig div { background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.sig .k { color: var(--muted); font-size: 11px; display: block; }
.badge.STOP_HIT { border-color: var(--up); color: #fff; background: var(--up); }
.badge.STOP_WARN { border-color: var(--warn); color: var(--warn); }
.badge.EXEMPT { color: var(--ink2); border-style: dashed; }
.badge.BREAKEVEN { border-color: #0ca30c; color: #0ca30c; }
.badge.ADD_BUY { border-color: var(--accent); color: var(--accent); }
.plan { margin-top: 6px; padding: 8px 10px; background: var(--surface); border-radius: 8px; font-variant-numeric: tabular-nums; }
/* 투자 일지 */
.jwrap { max-width: 820px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.jtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.jtools input { flex: 1; min-width: 160px; }
.chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.jday { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 10px 2px 0; }
.jentry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
.jhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.jhead .time { font-variant-numeric: tabular-nums; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
.badge.REVIEW, .badge.COWORK { border-color: var(--accent); color: var(--accent); }
.badge.BUY { border-color: var(--up); color: var(--up); }
.badge.SELL { border-color: var(--down); color: var(--down); }
.badge.AUTO, .badge.TRADE { color: var(--ink2); }
.jbody { font-size: 15px; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
.jbody p { margin: 0 0 10px; } .jbody p:last-child { margin-bottom: 0; }
.jbody ul, .jbody ol { margin: 4px 0 10px; padding-left: 22px; } .jbody li { margin: 4px 0; }
.jbody strong { font-weight: 700; }
.jbody.clamp { max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.jmore { margin-top: 6px; border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
</style>
</head>
<body>

<div id="lock">
  <form id="lockForm">
    <h1>투자 대시보드</h1>
    <div class="muted" style="font-size:13px">데이터는 암호화되어 있습니다. 비밀번호를 입력하세요.</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <label style="font-size:13px;display:flex;gap:6px;align-items:center"><input id="remember" type="checkbox"> 이 기기에서 기억하기</label>
    <button class="primary" type="submit" id="unlockBtn">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <h1>내 투자 대시보드</h1>
      <div class="muted" style="font-size:12px"><span id="asof"></span> · <button id="reload" style="padding:3px 10px;font-size:12px">새로고침</button> <button id="logout" style="padding:3px 10px;font-size:12px">잠그기</button></div>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="on">개요</button>
      <button data-tab="orders">내 주문</button>
      <button data-tab="reports">리포트</button>
      <button data-tab="docs">브리핑·회고</button>
      <button data-tab="recs">추천 종목</button>
      <button data-tab="news">뉴스·공시</button>
      <button data-tab="market">시황</button>
      <button data-tab="journal">투자 일지</button>
      <button data-tab="alerts">알림</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
// ---------- 유틸 ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (x) => x == null ? '-' : Math.round(x).toLocaleString('ko-KR') + '원';
const manwon = (x) => x == null ? '-' : (x / 1e4).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '만';
const eok = (x) => x == null ? '-' : (x > 0 ? '+' : '') + (x / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '억';
const pct = (x, d = 2) => x == null || isNaN(x) ? '-' : (x > 0 ? '+' : '') + (x * 100).toFixed(d) + '%';
const pctAbs = (x, d = 1) => x == null ? '-' : (x * 100).toFixed(d) + '%';
const cls = (x) => x > 0 ? 'up' : x < 0 ? 'down' : '';
const price = (x, cur) => x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR');
const kst = (iso) => iso ? new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
const STATUS_KO = { OPEN: '진행', TARGET_HIT: '목표 도달', STOPPED: '손절', EXPIRED: '만기' };

// ---------- 복호화 ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(enc, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function fetchEnc() {
  const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('데이터 파일을 불러오지 못했습니다 (' + r.status + ')');
  return r.json();
}

let D = null, password = null, tab = 'overview';

async function unlock(pw, { silent = false } = {}) {
  $('#unlockBtn').disabled = true; $('#err').textContent = silent ? '' : '복호화 중…';
  try {
    D = await decrypt(await fetchEnc(), pw);
    password = pw;
    if ($('#remember').checked || store.get('dash-pw')) store.set('dash-pw', pw);
    $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden');
    render();
  } catch (e) {
    $('#err').textContent = e.name === 'OperationError' ? '비밀번호가 맞지 않습니다.' : e.message;
    if (silent) store.del('dash-pw');
  } finally { $('#unlockBtn').disabled = false; }
}
$('#lockForm').addEventListener('submit', (e) => { e.preventDefault(); unlock($('#pw').value); });
$('#logout').addEventListener('click', () => { store.del('dash-pw'); D = null; password = null; $('#pw').value = ''; $('#err').textContent = ''; $('#app').classList.add('hidden'); $('#lock').classList.remove('hidden'); updateTitle(); });
$('#reload').addEventListener('click', () => password && unlock(password, { silent: true }));
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); render(); window.scrollTo(0, 0); });
const saved = store.get('dash-pw'); if (saved) { $('#remember').checked = true; unlock(saved, { silent: true }); }

// ---------- 브라우저 탭 제목: 다른 탭과 구분되도록 오늘 손익·현재 탭·경고 표시 ----------
const TAB_NAMES = { orders: '내 주문', news: '뉴스·공시', overview: '개요', reports: '리포트', docs: '브리핑·회고', recs: '추천 종목', market: '시황', journal: '투자 일지', alerts: '알림' };
function updateTitle() {
  if (!D) { document.title = '🔒 내 투자 대시보드'; return; }
  const r = D.portfolio?.summary?.dailyPl?.rate;
  const day = r == null ? '' : (r > 0 ? '🔴 +' : r < 0 ? '🔵 ' : '⚪ ') + (r * 100).toFixed(2) + '% · ';
  // 지금 유효한 손절·손절 임박·본전 도달 신호가 있을 때만 경고 표시
  const warn = (D.view?.holdings || []).some((x) => ['STOP_HIT', 'STOP_WARN', 'BREAKEVEN'].includes(x.signal?.state));
  document.title = (warn ? '⚠️ ' : '') + day + TAB_NAMES[tab] + ' | 내 투자';
}

// ---------- 렌더 ----------
function render() {
  updateTitle();
  $('#asof').textContent = (tab === 'market' && D.marketsUpdatedAt ? '시황 ' + kst(D.marketsUpdatedAt) : '데이터 ' + kst(D.generatedAt)) + ' 기준';
  $('#view').innerHTML = ({ overview, orders, reports, docs, recs, news, market, journal, alerts })[tab]();
  if (tab === 'overview') { historyChart(); allocChart(); }
  if (tab === 'reports') bindReports();
  if (tab === 'docs') bindDocs();
  if (tab === 'journal') bindJournal();
  if (tab === 'news') bindNews();
  if (tab === 'orders') bindOrders();
  if (tab === 'market') bindMarket();
}

function overview() {
  const p = D.portfolio, s = p?.summary || {}, v = D.view;
  if (!p) return '<div class="card empty">계좌 데이터가 아직 없습니다.</div>';
  return `
  <section class="kpis">
    ${kpi('총자산', won(s.totalValueKRW), `주식 ${manwon(s.holdingsValueKRW)} · 현금 ${manwon(s.cashTotalKRW)}`)}
    ${kpi('누적 손익률', `<span class="${cls(s.pl?.rate)}">${pct(s.pl?.rate)}</span>`, `비용 차감 ${pct(s.pl?.rateAfterCost)}`)}
    ${kpi('오늘 손익률', `<span class="${cls(s.dailyPl?.rate)}">${pct(s.dailyPl?.rate)}</span>`, `계좌 ${kst(p.takenAt)} 기준`)}
    ${kpi('현금 비중', pctAbs(s.cashRatio), v ? `권장 ${v.strategy.cashTargetPct}%` : '')}
    ${stanceKpi(v)}
  </section>
  ${v ? `<section class="card"><h2>오늘의 판단</h2>
    ${liveStanceLine(v)}
    <div class="stance">${esc(v.headline)}</div>
    <p style="margin:8px 0">${esc(v.strategy.summary)}</p>
    ${v.strategy.actions?.length ? `<ul class="flags">${v.strategy.actions.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
  </section>` : ''}
  <div class="grid2">
    <section class="card"><h2><span>총자산 추이</span><span id="histChips"></span></h2><div class="muted" id="histSub" style="font-size:12px;margin:-6px 0 6px"></div><div class="chart" id="hist"></div></section>
    <section class="card"><h2>자산 구성</h2><div class="chart" id="alloc"></div></section>
  </div>
  <section class="card"><h2>보유 종목</h2><div class="scroll">${holdingsTable(p.items)}</div>
    ${p.flags?.length ? `<ul class="flags">${p.flags.map((f) => `<li class="${f.level}">${f.level === 'WARN' ? '⚠ ' : ''}${esc(f.msg)}</li>`).join('')}</ul>` : ''}
  </section>
  ${v?.holdings?.length ? holdingPlansCard(v) : ''}
  ${D.agentStatus ? `<section class="card"><h2>PC 에이전트 상태</h2><div class="report">${marked.parse(D.agentStatus.replace(/^# .*\n/, ''))}</div></section>` : ''}`;
}
// 보유 종목 실행 계획: 판단 + 몇 주 사고팔지 + 금액 + 비중 변화 + 분할 실행
function sigBox(g) {
  if (!g) return '';
  const money = (x, cur) => x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원';
  const r = g.returnPct;
  if (g.exempt) return `<div class="sig">
    <div><span class="k">수익률</span><b class="${cls(r)}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</b></div>
    <div><span class="k">본전 (평균가)</span><b>${money(g.breakevenPrice, g.currency)}</b></div>
    <div><span class="k">본전까지</span>${r >= 0 ? '도달' : '+' + ((g.avgPrice / g.lastPrice - 1) * 100).toFixed(1) + '%'}</div>
    <div><span class="k">규칙</span>예외${g.exempt.since ? ' (' + esc(g.exempt.since) + '~)' : ''}</div>
  </div>`;
  return `<div class="sig">
    <div><span class="k">수익률 (평균가 ${money(g.avgPrice, g.currency)})</span><b class="${cls(r)}">${r > 0 ? '+' : ''}${r.toFixed(1)}%</b></div>
    <div><span class="k">손절가 (${g.stopLossPct}%)</span><b>${money(g.stopPrice, g.currency)}</b></div>
    <div><span class="k">손절 경고 (${g.stopWarnPct}%)</span>${money(g.warnPrice, g.currency)}</div>
    <div><span class="k">다음 추매가</span>${g.nextAddPrice != null ? `${money(g.nextAddPrice, g.currency)} (+${g.nextAddLevel}%)` : '단계 모두 도달'}</div>
  </div>`;
}

function holdingPlansCard(v) {
  const plans = v.holdingPlans?.items || [];
  const money = (x, cur) => cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원';
  const rows = v.holdings.map((h) => {
    const p = plans.find((x) => x.symbol === h.symbol);
    const act = !p || p.delta === 0 ? '<span class="badge">유지</span>'
      : `<span class="badge ${p.delta < 0 ? 'SELL' : 'BUY'}">${Math.abs(p.delta)}주 ${p.action}</span>`;
    const split = p && Math.abs(p.firstStep) !== Math.abs(p.delta)
      ? ` · 나눠서 실행: 1차 ${Math.abs(p.firstStep)}주, 이후 ${Math.abs(p.delta) - Math.abs(p.firstStep)}주` : '';
    const detail = p ? `<div class="plan">
        <div><b>${p.currentQty}주 → ${p.targetQty}주</b>${p.delta ? ` · 약 ${money(p.amount, p.currency)} (현재가 ${money(p.price, p.currency)})` : ''}</div>
        <div class="muted">비중 ${pctAbs(p.weightBefore)} → ${pctAbs(p.weightAfter)}${split}${p.limitedByCash ? ' · 현금 한도로 축소됨' : ''}</div>
      </div>` : '';
    return `<div class="item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(nameOf(h.symbol))}</b> <span class="pill">${esc(h.view)}</span> ${act} ${h.signal ? `<span class="badge ${h.signal.state}">${esc(h.signal.label)}</span>` : ''}</div>${sigBox(h.signal)}${detail}<div style="margin-top:4px">${esc(h.reason)}</div></div>`;
  }).join('');
  const hp = v.holdingPlans;
  const foot = hp ? `<p class="muted" style="font-size:13px;margin:10px 0 0">조정 후 현금 약 ${won(hp.cashAfterKRW)} (${pctAbs(hp.cashRatioAfter)}, 권장 ${hp.basis.cashTargetPct}%) · 단일 종목 한도 ${hp.basis.singlePositionCapPct}% 기준 · 실제 체결가에 따라 달라질 수 있습니다.</p>` : '';
  const note = hp?.note ? `<p style="font-size:13px;margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:var(--surface);border-radius:0 8px 8px 0">${esc(hp.note)}</p>` : '';
  return `<section class="card"><h2>보유 종목 실행 계획 <span class="pill">현재가 기준</span></h2>${rows}${foot}${note}</section>`;
}

// 장중 투자 방향 — PC 가 10분마다 시장 국면 점수로 다시 판단 (리포트와 같은 규칙)
function stanceKpi(v) {
  const L = D.markets?.liveStance;
  if (!L) return kpi('투자 방향', esc(v?.strategy?.stance ?? '-'), v ? esc(v.strategy.krUsSplit) : '');
  const changed = v && v.strategy.stance !== L.stance;
  return kpi('투자 방향 <span class="pill">장중</span>', esc(L.stance),
    `권장 현금 ${L.cashTargetPct}% · ${kst(L.updatedAt)}${changed ? `<br><span class="WARN">아침 리포트: ${esc(v.strategy.stance)} → 변경</span>` : ''}`);
}
function liveStanceLine(v) {
  const L = D.markets?.liveStance;
  if (!L) return '';
  const changed = v.strategy.stance !== L.stance;
  return `<div class="plan" style="margin:0 0 10px">
    <b>장중 판단 (${kst(L.updatedAt)}): ${esc(L.stance)}</b> · 권장 현금 ${L.cashTargetPct}% · ${esc(L.krUsSplit)}
    <div class="muted">시장 국면 점수 국내 ${L.krScore} / 미국 ${L.usScore} (평균 ${L.score}) · ${kst(L.since)}부터 유지${changed ? ` · <span class="WARN">아침 리포트(${esc(v.strategy.stance)})에서 바뀜 — 아래 실행 계획은 아침 리포트 기준</span>` : ' · 아침 리포트와 동일'}</div>
  </div>`;
}

const trendKo = (t) => ({ UP: '상승', DOWN: '하락', SIDEWAYS: '횡보' })[t] ?? t ?? '-';
const sessionKo = (s) => ({ KR: '국내장', US: '미국장', KRC: '국내장 마감' })[s] || s;
const kpi = (l, v, n) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
const nameOf = (sym) => D.portfolio?.items?.find((i) => i.symbol === sym)?.name || D.candidates?.find((c) => c.symbol === sym)?.name || sym;

function holdingsTable(items) {
  if (!items?.length) return '<div class="empty">보유 종목 없음</div>';
  return `<table><thead><tr><th>종목</th><th>손익률</th><th>오늘</th><th>추세</th><th>RSI</th><th>수량</th><th>평균가</th><th>현재가</th><th>평가금액</th><th>비중</th></tr></thead><tbody>${
    items.map((h) => `<tr><td>${esc(h.name)} <span class="muted">${esc(h.symbol)}</span></td><td class="${cls(h.plRate)}"><b>${pct(h.plRate)}</b></td><td class="${cls(h.dailyRate)}"><b>${pct(h.dailyRate)}</b></td><td><b>${trendKo(h.trend)}</b></td><td><b>${h.rsi14 != null ? h.rsi14.toFixed(0) : '-'}</b></td><td>${h.quantity}</td><td>${price(h.avgPrice, h.currency)}</td><td>${price(h.lastPrice, h.currency)}</td><td>${won(h.valueKRW)}</td><td>${pctAbs(h.weight)}</td></tr>`).join('')
  }</tbody></table>`;
}

function reports() {
  if (!D.reports.length) return '<div class="card empty">리포트가 없습니다.</div>';
  return `<section class="card"><h2>일일 리포트 <select id="rsel">${D.reports.map((r, i) => `<option value="${i}">${r.date} ${sessionKo(r.session)} · ${esc(r.stance)}${r.ai_used ? ' · AI' : ''}</option>`).join('')}</select></h2><div class="report" id="rbody"></div></section>`;
}
function bindReports() {
  const show = () => { const r = D.reports[$('#rsel').value]; $('#rbody').innerHTML = marked.parse(r.markdown); };
  $('#rsel')?.addEventListener('change', show); if ($('#rsel')) show();
}

function docs() {
  const list = D.documents || [];
  if (!list.length) return '<div class="card empty">Cowork 가 작성한 브리핑·회고가 아직 없습니다.</div>';
  return `<section class="card"><h2>Cowork 브리핑·회고 <select id="dsel">${list.map((d, i) => `<option value="${i}">[${d.kind}] ${esc(d.name)} · ${kst(d.modifiedAt)}</option>`).join('')}</select></h2><div class="report" id="dbody"></div></section>`;
}
function bindDocs() {
  const show = () => { $('#dbody').innerHTML = marked.parse(D.documents[$('#dsel').value].markdown); };
  $('#dsel')?.addEventListener('change', show); if ($('#dsel')) show();
}

// 장중 관찰 후보 (정규장 동안 30분마다 같은 기준으로 재선별)
function livePicksSection() {
  const L = D.livePicks;
  if (!L?.markets || !Object.keys(L.markets).length) return '';
  const money = (x, cur) => cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR');
  const block = (mk, label) => {
    const m = L.markets[mk];
    if (!m) return '';
    const rows = m.picks.map((p) => `<tr>
      <td>${p.status === '신규' ? '<span class="badge ADD_BUY">신규</span> ' : ''}${esc(p.name)} <span class="muted">${esc(p.symbol)}</span>${p.officialToday ? ' <span class="pill">오늘 공식 추천</span>' : ''}</td>
      <td>${p.score}${p.scoreChange ? ` <span class="${cls(p.scoreChange)}">(${p.scoreChange > 0 ? '+' : ''}${p.scoreChange})</span>` : ''}</td>
      <td>${esc(p.conviction)}</td>
      <td>${money(p.last, p.currency)}</td><td class="${cls(p.change1d)}">${pct(p.change1d)}</td>
      <td>${money(p.plan.stop, p.currency)}</td><td>${money(p.plan.target, p.currency)}</td>
      <td>${p.rsi14?.toFixed(0) ?? '-'}</td><td>${kst(p.since)}</td></tr>`).join('');
    const removed = (m.removed || []).map((r) => `${esc(r.name)} (${kst(r.removedAt)})`).join(', ');
    return `<h3 style="font-size:14px;margin:14px 0 6px">${label} <span class="muted" style="font-weight:400;font-size:12px">${kst(m.updatedAt)} 기준 · ${m.analyzed}종목 분석 → ${m.picks.length}개</span></h3>
      ${m.picks.length ? `<div class="scroll"><table><thead><tr><th>종목</th><th>점수</th><th>확신도</th><th>현재가</th><th>오늘</th><th>손절가</th><th>목표가</th><th>RSI</th><th>후보 편입</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">기준을 충족한 종목이 없습니다.</div>'}
      ${removed ? `<div class="muted" style="font-size:12px;margin-top:6px">오늘 탈락: ${removed}</div>` : ''}`;
  };
  return `<section class="card"><h2>장중 관찰 후보 <span class="pill">정규장 중 30분마다 재선별</span></h2>
    <details style="margin-bottom:6px"><summary class="muted" style="cursor:pointer;font-size:13px">선정 기준 보기</summary>
      <ul class="flags">${(L.criteria || []).map((c) => `<li>${esc(c)}</li>`).join('')}</ul></details>
    ${block('KR', '국내')}${block('US', '미국')}
    <p class="muted" style="font-size:12px;margin:10px 0 0">관찰 후보는 성과 추적 대상이 아닙니다. 아래 '최신 추천'(09:30 리포트)만 성과에 기록됩니다.</p>
  </section>`;
}

// ---------- 뉴스·공시 ----------
let nFilter = 'all';
function ago(iso) {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  return m < 60 ? `${Math.max(1, m)}분 전` : m < 1440 ? `${Math.round(m / 60)}시간 전` : `${Math.round(m / 1440)}일 전`;
}
function news() {
  const N = D.news;
  if (!N) return '<div class="card empty">뉴스가 아직 수집되지 않았습니다. PC 에이전트가 30분마다 수집합니다.</div>';
  const chips = [['all', '전체'], ['holding', '보유 종목'], ['pick', '추천·관찰'], ['market', '시장'], ...(N.dartEnabled ? [['disc', '공시만']] : [])];
  return `<div class="jtools" style="margin-bottom:4px">
      ${chips.map(([k, l]) => `<button class="chip ${nFilter === k ? 'on' : ''}" data-nf="${k}">${l}</button>`).join('')}
    </div>
    <div class="muted" style="font-size:12px">${kst(N.updatedAt)} 기준 · 뉴스 최근 24시간(Google 뉴스, 해외 종목도 한국어 기사 우선)${N.dartEnabled ? ' · 공시 최근 7일(DART)' : ''}</div>
    <div id="nlist" class="ngrid"></div>`;
}
function newsList() {
  const N = D.news;
  const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`;
  const art = (a) => `<div class="nitem">${a.lang === 'en' ? '<span class="pill">영문</span> ' : ''}${link(a.link, a.title)}<div class="meta">${esc(a.source)} · ${ago(a.publishedAt)}</div></div>`;
  const disc = (d) => `<div class="nitem"><span class="badge ${d.important ? 'DISC_IMP' : 'DISC'}">${d.important ? '중요 공시' : '공시'}</span> ${link(d.link, d.title)}<div class="meta">${esc(d.date)} · ${esc(d.filer)}</div></div>`;
  const cards = [];
  if (nFilter !== 'market') {
    for (const g of N.groups) {
      if (nFilter === 'holding' && g.type !== 'holding') continue;
      if (nFilter === 'pick' && g.type !== 'pick') continue;
      const ds = g.disclosures || [];
      if (nFilter === 'disc' && !ds.length) continue;
      const body = (nFilter === 'disc' ? ds.map(disc) : [...ds.map(disc), ...g.news.map(art)]).join('') || '<div class="empty" style="padding:8px 0">최근 뉴스·공시 없음</div>';
      const imp = ds.filter((d) => d.important).length;
      cards.push(`<section class="card"><h2><span>${esc(g.name)} <span class="muted" style="font-weight:400">${esc(g.symbol)}</span></span>
        <span><span class="pill">${g.type === 'holding' ? '보유' : '추천·관찰'}</span>${imp ? ` <span class="badge DISC_IMP">중요 공시 ${imp}</span>` : ''}</span></h2>${body}</section>`);
    }
  }
  if (nFilter === 'all' || nFilter === 'market') {
    for (const m of N.market) cards.push(`<section class="card"><h2>${esc(m.label)} <span class="pill">시장</span></h2>${m.news.map(art).join('') || '<div class="empty">뉴스 없음</div>'}</section>`);
  }
  return cards.join('') || '<div class="card empty">해당하는 항목이 없습니다.</div>';
}
function bindNews() {
  const draw = () => { $('#nlist').innerHTML = newsList(); };
  document.querySelectorAll('.chip[data-nf]').forEach((c) => c.addEventListener('click', () => {
    nFilter = c.dataset.nf; document.querySelectorAll('.chip[data-nf]').forEach((x) => x.classList.toggle('on', x === c)); draw();
  }));
  draw();
}

// ---------- 내 주문 (조회 전용) ----------
let oFilter = 'all';
function moneyC(x, cur) { return x == null ? '-' : cur === 'USD' ? '$' + Number(x).toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.round(x).toLocaleString('ko-KR') + '원'; }
function orders() {
  const O = D.orders;
  if (!O) return '<div class="card empty">주문 정보가 아직 수집되지 않았습니다. PC 에이전트가 5분마다 갱신합니다.</div>';
  const fee = O.commissions.map((c) => `<div class="kpi"><div class="l">${c.market === 'KR' ? '국내' : '미국'} 매매 수수료</div><div class="v">${(c.rate * 100).toFixed(3)}%</div>
    <div class="n">${c.endDate && c.endDate < '9999' ? `${esc(c.endDate)}까지${c.endingSoon ? ' <span class="WARN">· 곧 종료</span>' : ''}` : '기한 없음'}</div></div>`).join('');
  const sell = O.sellable.map((s) => `<div class="kpi"><div class="l">${esc(s.name)} 매도 가능</div><div class="v">${s.sellable}주</div>
    <div class="n">보유 ${s.holding}주${s.sellable < s.holding ? ' <span class="WARN">· 일부가 미체결 매도 주문에 묶여 있음</span>' : ''}</div></div>`).join('');
  const heldNoCond = (D.portfolio?.items || []).filter((h) => !O.conditionalOpen.some((c) => c.symbol === h.symbol));
  return `<section class="kpis">${fee}${sell}</section>
  <section class="card"><h2>미체결 주문 <span class="pill">${O.openOrders.length}건</span></h2>${O.openOrders.length ? orderTable(O.openOrders, true) : '<div class="empty">걸려 있는 주문이 없습니다.</div>'}</section>
  <section class="card"><h2>조건주문 — 감시 중 <span class="pill">${O.conditionalOpen.length}건</span></h2>
    ${O.conditionalOpen.length ? condTable(O.conditionalOpen) : '<div class="empty">감시 중인 조건주문이 없습니다.</div>'}
    ${heldNoCond.length ? `<p class="muted" style="font-size:12px;margin:8px 0 0">조건주문이 걸려 있지 않은 보유 종목: ${heldNoCond.map((h) => esc(h.name)).join(', ')} — 토스증권 앱의 조건주문(손절·익절 감시)으로 걸어두면 자리를 비워도 자동 실행됩니다.</p>` : ''}
  </section>
  <section class="card"><h2>최근 주문·체결 <span class="pill">최근 ${O.recentOrders.length}건</span></h2>
    <div class="jtools" style="margin-bottom:6px">${[['all', '전체'], ['filled', '체결된 것만']].map(([k, l]) => `<button class="chip ${oFilter === k ? 'on' : ''}" data-of="${k}">${l}</button>`).join('')}</div>
    <div id="olist" class="scroll list"></div></section>
  ${O.conditionalRecent.length ? `<section class="card"><h2>지난 조건주문</h2>${condTable(O.conditionalRecent)}</section>` : ''}
  <p class="muted" style="font-size:12px">${kst(O.updatedAt)} 기준 · 조회 전용(주문·취소는 토스증권 앱에서)</p>`;
}
function orderTable(list, open) {
  return `<div class="scroll"><table><thead><tr><th>주문 시각</th><th>종목</th><th>구분</th><th>유형</th><th>주문가</th><th>수량</th><th>체결</th><th>체결가</th><th>상태</th>${open ? '' : '<th>수수료·세금</th>'}</tr></thead><tbody>${
    list.map((o) => `<tr><td>${kst(o.orderedAt)}</td><td>${esc(o.name)}</td><td class="${o.side === '매수' ? 'up' : 'down'}">${o.side}</td><td>${esc(o.type)}</td>
      <td>${o.price != null ? moneyC(o.price, o.currency) : o.amount != null ? moneyC(o.amount, o.currency) + '어치' : '시장가'}</td><td>${o.quantity}주</td>
      <td>${o.filledQty}주</td><td>${o.avgFilledPrice != null ? moneyC(o.avgFilledPrice, o.currency) : '-'}</td><td>${esc(o.status)}</td>
      ${open ? '' : `<td>${o.commission != null || o.tax != null ? moneyC((o.commission || 0) + (o.tax || 0), o.currency) : '-'}</td>`}</tr>`).join('')
  }</tbody></table></div>`;
}
function condTable(list) {
  const leg = (l) => !l ? '-' : `${l.kind === '수익률' ? `수익률 ${l.targetProfitRate > 0 ? '+' : ''}${l.targetProfitRate}%` : '가격'}${l.triggerPrice != null ? ` (${Math.round(l.triggerPrice).toLocaleString('ko-KR')})` : ''} · ${esc(l.status)}`;
  return `<div class="scroll"><table><thead><tr><th>등록</th><th>종목</th><th>유형</th><th>조건 1</th><th>조건 2</th><th>수량</th><th>주문</th><th>만료일</th><th>상태</th></tr></thead><tbody>${
    list.map((c) => `<tr><td>${kst(c.createdAt)}</td><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${leg(c.first)}</td><td>${leg(c.second)}</td><td>${c.quantity}주</td><td>${esc(c.orderType)}</td><td>${esc(c.expireDate || '-')}</td><td>${esc(c.status)}</td></tr>`).join('')
  }</tbody></table></div>`;
}
function bindOrders() {
  const draw = () => {
    const el = $('#olist'); if (!el) return;
    const list = D.orders.recentOrders.filter((o) => oFilter === 'all' || o.filledQty > 0);
    el.innerHTML = list.length ? orderTable(list, false) : '<div class="empty">해당 주문이 없습니다.</div>';
  };
  document.querySelectorAll('.chip[data-of]').forEach((c) => c.addEventListener('click', () => {
    oFilter = c.dataset.of; document.querySelectorAll('.chip[data-of]').forEach((x) => x.classList.toggle('on', x === c)); draw();
  }));
  draw();
}

// ---------- 시황 보강 ----------
function sessionCard() {
  const S = D.markets?.sessions;
  if (!S) return '';
  const one = (label, s) => !s ? '' : `<div class="kpi"><div class="l">${label} 장 상태</div><div class="v">${s.open ? `<span class="badge ADD_BUY">${esc(s.session)}</span>` : '<span class="badge">장 마감</span>'}</div>
    <div class="n">${s.open ? `${kst(s.until)}까지` : s.next ? `다음: ${esc(s.next.session)} ${kst(s.next.at)}` : `다음 영업일 ${esc(s.nextBusinessDay || '-')}`}</div></div>`;
  return `<section class="kpis">${one('국내', S.KR)}${one('미국', S.US)}</section>`;
}
function curveCard() {
  const Y = D.markets?.kr?.yieldCurve;
  if (!Y) return '';
  const sp = Y.spread10y3yBp;
  return `<section class="card"><h2>국채 금리 곡선 <span class="pill">장단기 금리차(10년-3년) ${sp == null ? '-' : (sp > 0 ? '+' : '') + sp.toFixed(0) + 'bp'}${sp != null && sp < 0 ? ' · 역전' : ''}</span></h2>
    <div class="chart" id="curveChart"></div>
    <div class="scroll"><table><thead><tr><th>만기</th>${Y.points.map((p) => `<th>${p.label}</th>`).join('')}</tr></thead><tbody>

function longerFlowTable(f) {

// 단일 시리즈 선 차트 + 크로스헤어 툴팁 (범례 없음 — 제목이 시리즈 이름)
function lineChart(el, data, { fmtY = (v) => v, fmtX = (x) => x, tipX = fmtX, markers = false, H = 200 } = {}) {
  if (!el || data.length < 2) { if (el) el.innerHTML = '<div class="empty">데이터 부족</div>'; return; }
  const W = 560, P = { l: 56, r: 14, t: 12, b: 24 };
  const vs = data.map((d) => d.y), min = Math.min(...vs), max = Math.max(...vs), pad = (max - min) * 0.12 || Math.abs(max) * 0.01 || 1;
  const y0 = min - pad, y1 = max + pad;
  const X = (i) => P.l + (i / (data.length - 1)) * (W - P.l - P.r);
  const Y = (v) => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const ticks = [0, 1, 2, 3].map((i) => y0 + (i / 3) * (y1 - y0));
  const xl = markers && data.length <= 8 ? data.map((_, i) => i) : [...new Set([0, Math.floor((data.length - 1) / 2), data.length - 1])];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css('--grid')}"/><text x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${css('--muted')}">${fmtY(t)}</text>`).join('')}
    ${xl.map((i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${markers ? 'middle' : i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle'}" font-size="11" fill="${css('--muted')}">${fmtX(data[i].x)}</text>`).join('')}
    <path d="${data.map((d, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(d.y).toFixed(1)}`).join('')}" fill="none" stroke="${css('--line')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markers ? data.map((d, i) => `<circle cx="${X(i)}" cy="${Y(d.y)}" r="4" fill="${css('--line')}" stroke="${css('--card')}" stroke-width="2"/>`).join('') : ''}
    <line class="hx" y1="${P.t}" y2="${H - P.b}" stroke="${css('--axis')}" visibility="hidden"/>
    <circle class="hc" r="4" fill="${css('--line')}" stroke="${css('--card')}" stroke-width="2" visibility="hidden"/>
    <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), hx = svg.querySelector('.hx'), hc = svg.querySelector('.hc');
  svg.addEventListener('pointermove', (ev) => {
    const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(data.length - 1, Math.round(((sx - P.l) / (W - P.l - P.r)) * (data.length - 1))));
    hx.setAttribute('x1', X(i)); hx.setAttribute('x2', X(i)); hx.setAttribute('visibility', 'visible');
    hc.setAttribute('cx', X(i)); hc.setAttribute('cy', Y(data[i].y)); hc.setAttribute('visibility', 'visible');
    tip.style.display = 'block'; tip.innerHTML = `<div class="muted">${tipX(data[i].x)}</div><b>${fmtY(data[i].y)}</b>`;
    tip.style.left = Math.min((X(i) / W) * r.width + 12, r.width - tip.offsetWidth) + 'px'; tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; hx.setAttribute('visibility', 'hidden'); hc.setAttribute('visibility', 'hidden'); });
}
function bindMarket() {
  const I = D.markets?.kr?.intraday || {};

  for (const k of ['KOSPI', 'KOSDAQ']) if (I[k]) lineChart($('#intra-' + k), I[k].points.map((p) => ({ x: p.t, y: p.c })), { fmtY: (v) => v.toLocaleString('ko-KR', { maximumFractionDigits: 0 }), fmtX: hm });
  const Y = D.markets?.kr?.yieldCurve;

}

const ALERT_LABELS = { UP: '급등', DOWN: '급락', BIG: '급변', STOP: '추천 손절가 도달', TARGET: '추천 목표가 도달', LOSS: '손실 경고', STOP_LOSS: '보유 손절 신호', STOP_WARN: '보유 손절 임박', ADD_BUY: '보유 추매 신호', BREAKEVEN: '본전 도달', NEW_PICK: '장중 후보 신규', DROP_PICK: '장중 후보 탈락', STANCE: '투자 방향 변경', DISCLOSURE: '중요 공시' };
let jKind = 'ALL', jText = '';

function journal() {
  const kinds = [...new Set(D.journal.map((j) => j.kind))];
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  return `<div class="jwrap">
    <div class="jtools">
      ${['ALL', ...kinds].map((k) => `<button class="chip ${jKind === k ? 'on' : ''}" data-kind="${esc(k)}">${k === 'ALL' ? '전체 ' + D.journal.length : esc(label(k)) + ' ' + D.journal.filter((j) => j.kind === k).length}</button>`).join('')}
      <input id="jsearch" type="search" placeholder="일지 검색 (종목, 키워드)" value="${esc(jText)}">
    </div>
    <div id="jlist"></div>
  </div>`;
}

function journalList() {
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  const q = jText.trim().toLowerCase();
  const rows = D.journal.filter((j) => (jKind === 'ALL' || j.kind === jKind) && (!q || (j.body + ' ' + (j.symbol || '') + ' ' + nameOf(j.symbol)).toLowerCase().includes(q)));
  if (!rows.length) return '<div class="card empty">조건에 맞는 일지가 없습니다.</div>';
  const day = (iso) => new Date(iso).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  const time = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
  let html = '', last = '';
  for (const j of rows) {
    const d = day(j.created_at);
    if (d !== last) { html += `<div class="jday">${d}</div>`; last = d; }
    const md = window.journalToMarkdown ? journalToMarkdown(j.body) : j.body;
    const body = withNames(marked.parse(esc(md)));
    const long = md.length > 420;
    html += `<article class="jentry">
      <div class="jhead"><span class="badge ${esc(j.kind)}">${esc(label(j.kind))}</span><span class="time">${time(j.created_at)}</span>${j.symbol ? `<span>· ${esc(nameOf(j.symbol))} ${nameOf(j.symbol) !== j.symbol ? esc(j.symbol) : ''}</span>` : ''}</div>
      <div class="jbody ${long ? 'clamp' : ''}">${body}</div>
      ${long ? '<button class="jmore">더 보기 ▾</button>' : ''}
    </article>`;
  }
  return html;
}

// 본문 속 종목코드(6자리)·티커 옆에 종목명을 붙인다 (보유·추천 목록에 있는 것만)
function withNames(html) {
  const known = new Map([...(D.portfolio?.items || []), ...(D.candidates || [])].map((x) => [x.symbol, x.name]));
  return html.replace(/(?<![(\w])([0-9][0-9A-Z]{5}|[A-Z]{2,5})\b(?![^<]*>)/g, (m) => known.has(m) && known.get(m) !== m ? `${known.get(m)}(${m})` : m);
}

function bindJournal() {
  const draw = () => {
    $('#jlist').innerHTML = journalList();
    document.querySelectorAll('.jmore').forEach((b) => b.addEventListener('click', () => {
      const body = b.previousElementSibling; const open = body.classList.toggle('clamp');
      b.textContent = open ? '더 보기 ▾' : '접기 ▴';
    }));
  };
  document.querySelectorAll('.chip[data-kind]').forEach((c) => c.addEventListener('click', () => {
    jKind = c.dataset.kind; document.querySelectorAll('.chip[data-kind]').forEach((x) => x.classList.toggle('on', x === c)); draw();
  }));
  $('#jsearch').addEventListener('input', (e) => { jText = e.target.value; draw(); });
  draw();
}

function alerts() {
  if (!D.alerts.length) return '<div class="card empty">알림이 없습니다.</div>';
  return `<section class="card"><h2>실시간 알림 <span class="pill">${D.alerts.length}건</span></h2><div class="scroll"><table>
    <thead><tr><th>시각</th><th>종류</th><th style="text-align:left">내용</th></tr></thead><tbody>${
      D.alerts.map((a) => `<tr><td>${kst(a.created_at)}</td><td>${esc(ALERT_LABELS[a.kind] || a.kind)}</td><td class="wrap">${esc(a.message)}</td></tr>`).join('')
    }</tbody></table></div></section>`;
}

// ---------- 차트: 총자산 추이 — 오늘(장중, 5분 간격) / 일별 ----------
let histMode = null;
function historyChart() {
  const el = $('#hist'); if (!el) return;
  const intra = (D.intraday || []).map((r) => ({ x: r.ts, y: r.total_value_krw }));
  const daily = (D.history || []).map((r) => ({ x: r.date, y: r.total_value_krw }));
  histMode ??= intra.length >= 2 ? 'intra' : 'daily';
  const chips = $('#histChips');
  if (chips) {
    chips.innerHTML = [['intra', '오늘(장중)'], ['daily', '일별']].map(([k, l]) => `<button class="chip ${histMode === k ? 'on' : ''}" data-hm="${k}" style="padding:2px 10px;font-size:12px">${l}</button>`).join(' ');
    chips.querySelectorAll('[data-hm]').forEach((b) => b.addEventListener('click', () => { histMode = b.dataset.hm; historyChart(); }));
  }
  const data = histMode === 'intra' ? intra : daily;
  const sub = $('#histSub');
  if (data.length < 2) {
    if (sub) sub.textContent = '';
    el.innerHTML = `<div class="empty">${histMode === 'intra' ? '장중 기록이 쌓이는 중입니다 (5분마다).' : '일별 기록이 2일 이상 쌓이면 추이가 표시됩니다.'}<br><b style="color:var(--ink)">${won(data.at(-1)?.y ?? D.portfolio?.summary?.totalValueKRW)}</b></div>`;
    return;
  }
  const first = data[0], last = data.at(-1), ch = last.y / first.y - 1;
  const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  if (sub) sub.innerHTML = histMode === 'intra'
    ? `${new Date(first.x).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' })} ${hm(first.x)} → ${hm(last.x)} · <span class="${cls(ch)}">${pct(ch)} (${won(last.y - first.y).replace(/^(?!-)/, last.y >= first.y ? '+' : '')})</span>`
    : `${first.x} → ${last.x} · <span class="${cls(ch)}">${pct(ch)}</span> · 오늘 값은 5분마다 갱신`;
  lineChart(el, data, histMode === 'intra'
    ? { fmtY: (v) => manwon(v), fmtX: hm, tipX: (t) => kst(t), H: 220 }
    : { fmtY: (v) => manwon(v), fmtX: (d) => d.slice(5), tipX: (d) => d, markers: data.length <= 31, H: 220 });
}

// ---------- 차트: 자산 구성 (단일 색 막대, 현금은 회색) ----------
function allocChart() {
  const el = $('#alloc'); if (!el) return;
  const s = D.portfolio.summary;
  const rows = [...D.portfolio.items.map((h) => ({ name: h.name, w: h.weight, v: h.valueKRW })), { name: '현금', w: s.cashRatio, v: s.cashTotalKRW, cash: true }].filter((r) => r.w > 0.001);
  if (!rows.length) { el.innerHTML = '<div class="empty">자산 없음</div>'; return; }
  const W = 360, rowH = 30, P = { l: 92, r: 52 }, H = rows.length * rowH + 4, max = Math.max(...rows.map((r) => r.w));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="자산 구성 비중">${rows.map((r, i) => {
    const w = Math.max(2, (r.w / max) * (W - P.l - P.r)), y = i * rowH + 6;
    return `<g><title>${esc(r.name)} ${(r.w * 100).toFixed(1)}% · ${won(r.v)}</title>
      <text x="${P.l - 8}" y="${y + 13}" text-anchor="end" font-size="12" fill="${css('--ink2')}">${esc(r.name.length > 9 ? r.name.slice(0, 8) + '…' : r.name)}</text>
      <rect x="${P.l}" y="${y}" width="${w}" height="18" rx="4" fill="${r.cash ? css('--bar-cash') : css('--bar')}"/>
      <text x="${P.l + w + 6}" y="${y + 13}" font-size="12" fill="${css('--ink')}">${(r.w * 100).toFixed(1)}%</text></g>`;
  }).join('')}</svg>`;
}
</script>
