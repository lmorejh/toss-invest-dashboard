    ${(nd?.markets || []).map((mk) => `<div class="tgroup"><b>${esc(mk.name)}</b> <span class="badge ${bcls(mk.bias)}">${esc(mk.bias)}</span> <span class="muted" style="font-size:12px">방향 점수 ${mk.score > 0 ? '+' : ''}${mk.score}</span>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(mk.reasons.join(' · '))}</div>
      ${mk.levels ? `<div style="font-size:12px;margin-top:4px"><b>지지</b> ${mk.levels.supports.map((x) => `${n0(x.value)} <span class="muted">${esc(x.name)} ${x.gapPct}%</span>`).join(' · ') || '-'} &nbsp; <b>저항</b> ${mk.levels.resistances.map((x) => `${n0(x.value)} <span class="muted">${esc(x.name)} +${x.gapPct}%</span>`).join(' · ') || '-'}</div>` : ''}
      <ul class="flags" style="font-size:12px;margin-top:2px">${mk.watch.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>`).join('')}
    ${nd?.events?.length ? `<div style="font-size:12px;margin-top:6px"><b>가까운 일정</b> ${nd.events.map((e) => `${esc(e.date)} ${esc(e.event)} <span class="muted">(${esc(e.impact)})</span>`).join(' · ')}</div>` : ''}
    ${nd?.holdings?.length ? `<div style="margin-top:10px"><b style="font-size:13px">보유 종목 관전 포인트</b>${nd.holdings.map((h) => `<div class="tgroup"><b>${esc(h.name)}</b> <span class="badge ${bcls(h.bias)}">${esc(h.bias)}</span> <span class="muted" style="font-size:12px">${esc(h.why.join(' · '))}</span>${h.watch ? `<div style="font-size:12px;margin-top:2px">${esc(h.watch)}</div>` : ''}</div>`).join('')}</div>` : ''}
    <p class="muted" style="font-size:11px;margin:6px 0 0">방향 점수 = 시장 국면 + 오늘 모멘텀 + 수급 + 20일선 위치(+ 간밤 미국장). 규칙 기반 참고치이며 수익을 보장하지 않습니다.</p>
  </section>`;
}
function market() {
  const m = D.markets, v = D.view;
  if (!m) return '<div class="card empty">시황 데이터가 없습니다.</div>';
  const live = D.marketsSource === 'live';
  const asof = `<div class="muted" style="font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge ${live ? 'ADD_BUY' : ''}">${live ? '장중 갱신' : '리포트 기준'}</span>
    <span>지수·수급·섹터·금리·환율 ${kst(D.marketsUpdatedAt)} 기준 (PC가 5분마다 갱신)</span>
    ${v ? `<span>· 해설 문구는 ${D.reports[0] ? D.reports[0].date + ' ' + sessionKo(D.reports[0].session) : ''} 리포트 판단</span>` : ''}
  </div>`;
  const idxRow = (name, t, unit = '') => t ? `<tr><td>${esc(name)}</td><td>${unit}${t.last?.toLocaleString('ko-KR', { maximumFractionDigits: 2 })}</td><td class="${cls(t.change1d)}">${pct(t.change1d)}</td><td class="${cls(t.ret5d)}">${pct(t.ret5d)}</td><td class="${cls(t.ret20d)}">${pct(t.ret20d)}</td><td>${t.aboveMA20 ? '위' : '아래'}</td><td>${t.aboveMA60 ? '위' : '아래'}</td></tr>` : '';
  const head = '<thead><tr><th>지표</th><th>현재</th><th>1일</th><th>5일</th><th>20일</th><th>20일선</th><th>60일선</th></tr></thead>';
  const sectors = (list) => `<table><thead><tr><th>섹터</th><th>5일</th><th>20일</th><th>RSI</th></tr></thead><tbody>${[...list].filter((s) => s.ret20d != null).sort((a, b) => b.ret20d - a.ret20d).map((s) => `<tr><td>${esc(s.name)} <span class="muted">${esc(s.symbol)}</span></td><td class="${cls(s.ret5d)}">${pct(s.ret5d, 1)}</td><td class="${cls(s.ret20d)}">${pct(s.ret20d, 1)}</td><td>${s.rsi14?.toFixed(0) ?? '-'}</td></tr>`).join('')}</tbody></table>`;
  const flows = m.kr.flows?.KOSPI;
  const rank = (list) => (list || []).slice(0, 10).map((x) => `<tr><td>${esc(x.name)}</td><td class="${cls(x.changeRate)}">${pct(x.changeRate, 1)}</td></tr>`).join('');
  return `${asof}
  ${premarketCard(v)}
  ${movesCard(v)}
  ${nextDayCard(v)}
  ${sessionCard()}
  ${intradayCard()}
  ${levelsCard()}
  ${flowsIntradayCard()}
  <div class="grid2e">
    <section class="card"><h2>국내 <span class="pill">${esc(m.kr.regime.label)} · ${m.kr.regime.score}</span></h2>
      ${v ? `<p style="margin:0 0 10px">${esc(v.marketView.kr.summary)}</p>` : ''}
      <div class="scroll"><table>${head}<tbody>${idxRow('KOSPI', m.kr.indices.KOSPI)}${idxRow('KOSDAQ', m.kr.indices.KOSDAQ)}</tbody></table></div>
      <p class="muted" style="font-size:13px">국고채 3년 ${m.kr.rates.kr3y ?? '-'}% · 10년 ${m.kr.rates.kr10y ?? '-'}% · 원/달러 ${m.fx.usdkrw?.toFixed(1)} (30일 ${pct(m.fx.change30d)})</p>
    </section>
    <section class="card"><h2>미국 <span class="pill">${esc(m.us.regime.label)} · ${m.us.regime.score}</span></h2>
      ${v ? `<p style="margin:0 0 10px">${esc(v.marketView.us.summary)}</p>` : ''}
      <div class="scroll"><table>${head}<tbody>${m.us.benchmarks.map((t) => idxRow(`${t.name} (${t.symbol})`, t, '$')).join('')}</tbody></table></div>
    </section>
  </div>
  ${curveCard()}
  <div class="grid2e">${flowCard('코스피', m.kr.flows?.KOSPI, m.kr.flowsLonger?.KOSPI)}${flowCard('코스닥', m.kr.flows?.KOSDAQ, m.kr.flowsLonger?.KOSDAQ)}</div>
  <div class="grid2e">
    <section class="card"><h2>국내 섹터 강도</h2><div class="scroll">${sectors(m.kr.sectors)}</div></section>
    <section class="card"><h2>미국 섹터 강도</h2><div class="scroll">${sectors(m.us.sectors)}</div></section>
  </div>
  <div class="grid2e">
    <section class="card"><h2>국내 상승률 상위</h2><table><tbody>${rank(m.kr.rankings?.TOP_GAINERS)}</tbody></table></section>
    <section class="card"><h2>미국 상승률 상위</h2><table><tbody>${rank(m.us.rankings?.TOP_GAINERS)}</tbody></table></section>
  </div>
  <div class="grid2e">
    <section class="card"><h2>국내 하락률 상위</h2><table><tbody>${rank(m.kr.rankings?.TOP_LOSERS)}</tbody></table></section>
    <section class="card"><h2>미국 하락률 상위</h2><table><tbody>${rank(m.us.rankings?.TOP_LOSERS)}</tbody></table></section>
  </div>
  ${v?.outlook ? `<section class="card"><h2>향후 1주 전망</h2><p><b>향후 1주</b> ${esc(v.outlook.nextWeek)}</p>${(v.outlook.scenarios || []).map((s) => `<div class="item"><b>${esc(s.name)}</b> <span class="pill">${s.probabilityPct}%</span><div>${esc(s.description)}</div></div>`).join('')}</section>` : ''}`;
}

const ALERT_LABELS = { UP: '급등', DOWN: '급락', BIG: '급변', STOP: '추천 손절가 도달', TARGET: '추천 목표가 도달', LOSS: '손실 경고', STOP_LOSS: '보유 손절 신호', STOP_WARN: '보유 손절 임박', ADD_BUY: '보유 추매 신호', BREAKEVEN: '본전 도달', NEW_PICK: '장중 후보 신규', DROP_PICK: '장중 후보 탈락', STANCE: '투자 방향 변경', DISCLOSURE: '중요 공시', SCENARIO: '대응 시나리오 변경', ENTRY: '추천 종목 진입 신호' };
let jKind = 'ALL', jText = '';

function journal() {
  const kinds = [...new Set(D.journal.map((j) => j.kind))];
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  return `<div class="jwrap">
    <div class="jtools">
      ${['ALL', ...kinds].map((k) => `<button class="chip ${jKind === k ? 'on' : ''}" data-kind="${esc(k)}">${k === 'ALL' ? '전체 ' + D.journal.length : esc(label(k)) + ' ' + D.journal.filter((j) => j.kind === k).length}</button>`).join('')}
      <input id="jsearch" type="search" placeholder="일지 검색 (종목, 키워드)" value="${esc(jText)}">
    </div>
    <div id="jlist"></div>
  </div>`;
}

function journalList() {
  const label = (k) => (window.JOURNAL_KIND_LABELS || {})[k] || k;
  const q = jText.trim().toLowerCase();
  const rows = D.journal.filter((j) => (jKind === 'ALL' || j.kind === jKind) && (!q || (j.body + ' ' + (j.symbol || '') + ' ' + nameOf(j.symbol)).toLowerCase().includes(q)));
  if (!rows.length) return '<div class="card empty">조건에 맞는 일지가 없습니다.</div>';
  const day = (iso) => new Date(iso).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  const time = (iso) => new Date(iso).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' });
  let html = '', last = '';
  for (const j of rows) {
    const d = day(j.created_at);
    if (d !== last) { html += `<div class="jday">${d}</div>`; last = d; }
    const md = window.journalToMarkdown ? journalToMarkdown(j.body) : j.body;
    const body = withNames(marked.parse(esc(md)));
    const long = md.length > 420;
    html += `<article class="jentry">
      <div class="jhead"><span class="badge ${esc(j.kind)}">${esc(label(j.kind))}</span><span class="time">${time(j.created_at)}</span>${j.symbol ? `<span>· ${esc(nameOf(j.symbol))} ${nameOf(j.symbol) !== j.symbol ? esc(j.symbol) : ''}</span>` : ''}</div>
      <div class="jbody ${long ? 'clamp' : ''}">${body}</div>
      ${long ? '<button class="jmore">더 보기 ▾</button>' : ''}
    </article>`;
  }
  return html;
}

// 본문 속 종목코드(6자리)·티커 옆에 종목명을 붙인다 (보유·추천 목록에 있는 것만)
function withNames(html) {
  const known = new Map([...(D.portfolio?.items || []), ...(D.candidates || [])].map((x) => [x.symbol, x.name]));
  return html.replace(/(?<![(\w])([0-9][0-9A-Z]{5}|[A-Z]{2,5})\b(?![^<]*>)/g, (m) => known.has(m) && known.get(m) !== m ? `${known.get(m)}(${m})` : m);
}

function bindJournal() {
  const draw = () => {
    $('#jlist').innerHTML = journalList();
    document.querySelectorAll('.jmore').forEach((b) => b.addEventListener('click', () => {
      const body = b.previousElementSibling; const open = body.classList.toggle('clamp');
      b.textContent = open ? '더 보기 ▾' : '접기 ▴';
    }));
  };
  document.querySelectorAll('.chip[data-kind]').forEach((c) => c.addEventListener('click', () => {
    jKind = c.dataset.kind; document.querySelectorAll('.chip[data-kind]').forEach((x) => x.classList.toggle('on', x === c)); draw();
  }));
  $('#jsearch').addEventListener('input', (e) => { jText = e.target.value; draw(); });
  draw();
}

function alerts() {
  if (!D.alerts.length) return '<div class="card empty">알림이 없습니다.</div>';
  return `<section class="card"><h2>실시간 알림 <span class="pill">${D.alerts.length}건</span></h2><div class="scroll"><table>
    <thead><tr><th>시각</th><th>종류</th><th style="text-align:left">내용</th></tr></thead><tbody>${
      D.alerts.map((a) => `<tr><td>${kst(a.created_at)}</td><td>${esc(ALERT_LABELS[a.kind] || a.kind)}</td><td class="wrap">${esc(a.message)}</td></tr>`).join('')
    }</tbody></table></div></section>`;
}

// ---------- 차트: 총자산 추이 — 오늘(장중, 5분 간격) / 일별 ----------
let histMode = null;
function historyChart() {
  const el = $('#hist'); if (!el) return;
  const intra = (D.intraday || []).map((r) => ({ x: r.ts, y: r.total_value_krw }));
  const daily = (D.history || []).map((r) => ({ x: r.date, y: r.total_value_krw }));
  histMode ??= intra.length >= 2 ? 'intra' : 'daily';
  const chips = $('#histChips');
  if (chips) {
    chips.innerHTML = [['intra', '오늘(장중)'], ['daily', '일별']].map(([k, l]) => `<button class="chip ${histMode === k ? 'on' : ''}" data-hm="${k}" style="padding:2px 10px;font-size:12px">${l}</button>`).join(' ');
    chips.querySelectorAll('[data-hm]').forEach((b) => b.addEventListener('click', () => { histMode = b.dataset.hm; historyChart(); }));
  }
  const data = histMode === 'intra' ? intra : daily;
  const sub = $('#histSub');
  if (data.length < 2) {
    if (sub) sub.textContent = '';
    el.innerHTML = `<div class="empty">${histMode === 'intra' ? '장중 기록이 쌓이는 중입니다 (5분마다).' : '일별 기록이 2일 이상 쌓이면 추이가 표시됩니다.'}<br><b style="color:var(--ink)">${won(data.at(-1)?.y ?? D.portfolio?.summary?.totalValueKRW)}</b></div>`;
    return;
  }
  const first = data[0], last = data.at(-1), ch = last.y / first.y - 1;
  const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
  if (sub) sub.innerHTML = histMode === 'intra'
    ? `${new Date(first.x).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' })} ${hm(first.x)} → ${hm(last.x)} · <span class="${cls(ch)}">${pct(ch)} (${won(last.y - first.y).replace(/^(?!-)/, last.y >= first.y ? '+' : '')})</span>`
    : `${first.x} → ${last.x} · <span class="${cls(ch)}">${pct(ch)}</span> · 오늘 값은 5분마다 갱신`;
  lineChart(el, data, histMode === 'intra'
    ? { fmtY: (v) => manwon(v), fmtX: hm, tipX: (t) => kst(t), H: 220 }
    : { fmtY: (v) => manwon(v), fmtX: (d) => d.slice(5), tipX: (d) => d, markers: data.length <= 31, H: 220 });
}

// ---------- 차트: 자산 구성 (단일 색 막대, 현금은 회색) ----------
function allocChart() {
  const el = $('#alloc'); if (!el) return;
  const s = D.portfolio.summary;
  const rows = [...D.portfolio.items.map((h) => ({ name: h.name, w: h.weight, v: h.valueKRW })), { name: '현금', w: s.cashRatio, v: s.cashTotalKRW, cash: true }].filter((r) => r.w > 0.001);
  if (!rows.length) { el.innerHTML = '<div class="empty">자산 없음</div>'; return; }
  const W = 360, rowH = 30, P = { l: 92, r: 52 }, H = rows.length * rowH + 4, max = Math.max(...rows.map((r) => r.w));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="자산 구성 비중">${rows.map((r, i) => {
    const w = Math.max(2, (r.w / max) * (W - P.l - P.r)), y = i * rowH + 6;
    return `<g><title>${esc(r.name)} ${(r.w * 100).toFixed(1)}% · ${won(r.v)}</title>
      <text x="${P.l - 8}" y="${y + 13}" text-anchor="end" font-size="12" fill="${css('--ink2')}">${esc(r.name.length > 9 ? r.name.slice(0, 8) + '…' : r.name)}</text>
      <rect x="${P.l}" y="${y}" width="${w}" height="18" rx="4" fill="${r.cash ? css('--bar-cash') : css('--bar')}"/>
      <text x="${P.l + w + 6}" y="${y + 13}" font-size="12" fill="${css('--ink')}">${(r.w * 100).toFixed(1)}%</text></g>`;
  }).join('')}</svg>`;
}
</script>
</body>
</html>
